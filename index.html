<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultimate Mobile FPS Arena</title>
    <style>
        body { margin: 0; overflow: hidden; touch-action: none; background: #87CEEB; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

        #minimap-container {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 150px;
            height: 150px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 4px;
            pointer-events: none;
        }
        #minimap {
            width: 100%;
            height: 100%;
        }

        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 18px; height: 18px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: "";
            position: absolute;
            left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.95);
            box-shadow: 0 0 6px rgba(255,255,255,0.9);
        }
        #crosshair::before {
            width: 2px; height: 18px;
        }
        #crosshair::after {
            width: 18px; height: 2px;
        }

        .btn {
            position: absolute; pointer-events: auto; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: bold; user-select: none;
            border: 2px solid rgba(255,255,255,0.4);
            background: rgba(0,0,0,0.3); transition: transform 0.05s;
        }
        .btn:active { transform: scale(0.9); background: rgba(0,0,0,0.5); }

        #joystick-container {
            bottom: 40px; left: 40px; width: 130px; height: 130px;
            border-radius: 50%; border: 2px solid rgba(255,255,255,0.2);
            position: absolute; pointer-events: auto; background: rgba(255,255,255,0.1);
            display: none;
        }
        #joystick-container.mobile-visible { display: block; }
        #joystick-knob {
            position: absolute; top: 40px; left: 40px; width: 50px; height: 50px;
            background: rgba(255,255,255,0.4); border-radius: 50%;
        }

        #fire-button { bottom: 140px; right: 40px; width: 100px; height: 100px; background: rgba(255, 50, 50, 0.6); font-size: 20px; display: none; }
        #fire-button.mobile-visible { display: flex; }
        #jump-button { bottom: 40px; right: 160px; width: 80px; height: 80px; background: rgba(50, 150, 255, 0.6); display: none; }
        #jump-button.mobile-visible { display: flex; }
        #reload-button { bottom: 40px; right: 40px; width: 80px; height: 80px; background: rgba(80, 80, 80, 0.8); font-size: 13px; display: none; }
        #reload-button.mobile-visible { display: flex; }

        #weapon-swap-button { bottom: 220px; right: 40px; width: 80px; height: 80px; background: rgba(255, 200, 0, 0.6); font-size: 12px; display: none; }
        #weapon-swap-button.mobile-visible { display: flex; }

        #reload-container {
            position: absolute; top: 58%; left: 50%; transform: translate(-50%, -50%);
            width: 140px; text-align: center; display: none;
        }
        #reload-text { color: #ff3300; font-weight: bold; font-size: 14px; margin-bottom: 5px; text-shadow: 1px 1px 2px black; }
        #reload-bar-bg { width: 100%; height: 8px; background: rgba(0,0,0,0.5); border-radius: 4px; overflow: hidden; }
        #reload-bar-fill { width: 0%; height: 100%; background: #00ffcc; }

        #ammo-display { position: absolute; top: 20px; left: 20px; font-size: 28px; font-weight: bold; color: #000; text-shadow: 1px 1px 2px rgba(255,255,255,0.8); }
        #weapon-display { position: absolute; top: 60px; left: 20px; font-size: 16px; font-weight: bold; color: #000; text-shadow: 1px 1px 2px rgba(255,255,255,0.8); }

        #controls-guide {
            position: absolute; bottom: 20px; right: 20px; color: #000; font-size: 12px;
            background: rgba(255,255,255,0.7); padding: 10px 15px; border-radius: 8px;
            text-align: right; line-height: 1.6;
        }
        #controls-guide.hidden { display: none; }

        @supports (padding: max(0px)) {
            #joystick-container {
                bottom: max(40px, env(safe-area-inset-bottom));
                left: max(40px, env(safe-area-inset-left));
            }
            #fire-button {
                bottom: max(140px, calc(140px + env(safe-area-inset-bottom)));
                right: max(40px, env(safe-area-inset-right));
            }
            #jump-button {
                bottom: max(40px, env(safe-area-inset-bottom));
                right: max(160px, calc(160px + env(safe-area-inset-right)));
            }
            #reload-button {
                bottom: max(40px, env(safe-area-inset-bottom));
                right: max(40px, env(safe-area-inset-right));
            }
            #weapon-swap-button {
                bottom: max(220px, calc(220px + env(safe-area-inset-bottom)));
                right: max(40px, env(safe-area-inset-right));
            }
            #controls-guide {
                bottom: max(20px, env(safe-area-inset-bottom));
                right: max(20px, env(safe-area-inset-right));
            }
            #ammo-display {
                top: max(20px, env(safe-area-inset-top));
                left: max(20px, env(safe-area-inset-left));
            }
            #weapon-display {
                top: max(60px, calc(60px + env(safe-area-inset-top)));
                left: max(20px, env(safe-area-inset-left));
            }
            #minimap-container {
                top: max(20px, env(safe-area-inset-top));
                right: max(20px, env(safe-area-inset-right));
            }
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div id="crosshair"></div>
        <div id="ammo-display">15 / 15</div>
        <div id="weapon-display">PISTOL</div>

        <div id="reload-container">
            <div id="reload-text">RELOADING</div>
            <div id="reload-bar-bg"><div id="reload-bar-fill"></div></div>
        </div>

        <div id="minimap-container">
            <canvas id="minimap"></canvas>
        </div>

        <div id="joystick-container"><div id="joystick-knob"></div></div>
        <div id="fire-button" class="btn">FIRE</div>
        <div id="jump-button" class="btn">JUMP</div>
        <div id="weapon-swap-button" class="btn">SWAP<br>GUN</div>
        <div id="reload-button" class="btn">RELOAD</div>

        <div id="controls-guide">
            <div>WASD: 移動</div>
            <div>Mouse: 視点</div>
            <div>Click: 射撃</div>
            <div>Space: ジャンプ</div>
            <div>R: リロード</div>
            <div>E: 武器切り替え</div>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const isTablet = /iPad|Android/i.test(navigator.userAgent) && window.innerWidth > 600;

        if(isMobile) {
            document.getElementById('joystick-container').classList.add('mobile-visible');
            document.getElementById('fire-button').classList.add('mobile-visible');
            document.getElementById('jump-button').classList.add('mobile-visible');
            document.getElementById('weapon-swap-button').classList.add('mobile-visible');
            document.getElementById('reload-button').classList.add('mobile-visible');
            document.getElementById('controls-guide').classList.add('hidden');
        } else {
            document.getElementById('controls-guide').classList.remove('hidden');
        }

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 15, 100);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const light = new THREE.HemisphereLight(0xffffff, 0x80bb88, 2);
        scene.add(light);

        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(200, 200),
            new THREE.MeshStandardMaterial({
                color: 0x2d8a3d,
                roughness: 0.8,
                map: new THREE.CanvasTexture((function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = canvas.height = 64;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#2d8a3d';
                    ctx.fillRect(0, 0, 64, 64);
                    for(let i = 0; i < 200; i++) {
                        ctx.fillStyle = Math.random() > 0.7 ? '#1f6a2a' : '#3a9a47';
                        ctx.fillRect(Math.random()*64, Math.random()*64, Math.random()*4+1, Math.random()*4+1);
                    }
                    return canvas;
                })())
            })
        );
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        function addTree(x, z) {
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.5, 3, 8), new THREE.MeshStandardMaterial({color: 0x8B4513}));
            trunk.position.set(x, 1.5, z);
            scene.add(trunk);

            const foliage = new THREE.Mesh(new THREE.SphereGeometry(2, 8, 8), new THREE.MeshStandardMaterial({color: 0x228b22}));
            foliage.position.set(x, 4, z);
            scene.add(foliage);

            colliders.push({minX: x-0.8, maxX: x+0.8, minZ: z-0.8, maxZ: z+0.8, width: 1.6, depth: 1.6, height: 3});
        }

        const colliders = [];
        const wallMat = new THREE.MeshStandardMaterial({color: 0xc4a570, roughness: 0.9});
        const damagedWallMat = new THREE.MeshStandardMaterial({color: 0xb8956f, roughness: 0.95});
        const metalMat = new THREE.MeshStandardMaterial({color: 0xaaaaaa, metalness: 0.8, roughness: 0.2});

        function addBox(x, z, w, h, d, mat, isInterior = false) {
            const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            m.position.set(x, h/2, z);
            scene.add(m);

            if(!isInterior) {
                colliders.push({
                    minX: x-w/2, maxX: x+w/2,
                    minZ: z-d/2, maxZ: z+d/2,
                    width: w, depth: d, height: h
                });
            }
        }

        function createBuilding(x, z, w, d, h, floors) {
            addBox(x - w/2, z, 0.5, h, d, wallMat, true);
            addBox(x + w/2, z, 0.5, h, d, wallMat, true);
            addBox(x, z - d/2, w, h, 0.5, wallMat, true);
            addBox(x, z + d/2, w, h, 0.5, wallMat, true);

            const floorHeight = h / floors;
            for(let i = 0; i <= floors; i++) {
                const floorBox = new THREE.Mesh(
                    new THREE.BoxGeometry(w * 0.8, 0.1, d * 0.8),
                    new THREE.MeshStandardMaterial({color: 0xc4a570})
                );
                floorBox.position.set(x, floorHeight * i + 0.2, z);
                scene.add(floorBox);
            }
        }

        createBuilding(0, -15, 12, 8, 25, 5);
        addBox(-20, -25, 10, 15, 8, damagedWallMat);
        addBox(20, -25, 10, 15, 8, wallMat);
        addBox(0, -50, 20, 18, 10, wallMat);
        addBox(-15, -35, 6, 8, 8, metalMat);
        addBox(15, -35, 6, 8, 8, metalMat);
        addBox(-35, -20, 4, 6, 4, damagedWallMat);
        addBox(35, -20, 4, 6, 4, damagedWallMat);
        addBox(-10, -60, 8, 3, 8, metalMat);

        addTree(-40, 0);
        addTree(40, 0);
        addTree(-45, -30);
        addTree(45, -30);
        addTree(0, 30);
        addTree(-25, 25);
        addTree(25, 25);

        function createDummy(x, z) {
            const dummyGroup = new THREE.Group();
            dummyGroup.position.set(x, 0, z);

            const body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1, 0.3), new THREE.MeshStandardMaterial({color: 0x4488ff}));
            body.position.y = 1;
            dummyGroup.add(body);

            const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), new THREE.MeshStandardMaterial({color: 0xffcc99}));
            head.position.y = 2;
            dummyGroup.add(head);

            const armMat = new THREE.MeshStandardMaterial({color: 0xffcc99});
            const leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.8, 0.2), armMat);
            leftArm.position.set(-0.4, 1.4, 0);
            dummyGroup.add(leftArm);
            const rightArm = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.8, 0.2), armMat);
            rightArm.position.set(0.4, 1.4, 0);
            dummyGroup.add(rightArm);

            const legMat = new THREE.MeshStandardMaterial({color: 0x222222});
            const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.9, 0.2), legMat);
            leftLeg.position.set(-0.15, 0.45, 0);
            dummyGroup.add(leftLeg);
            const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.9, 0.2), legMat);
            rightLeg.position.set(0.15, 0.45, 0);
            dummyGroup.add(rightLeg);

            scene.add(dummyGroup);
            return {
                group: dummyGroup,
                body: body,
                leftArm: leftArm,
                rightArm: rightArm,
                leftLeg: leftLeg,
                rightLeg: rightLeg,
                moveDir: Math.random() * Math.PI * 2,
                wanderTimer: 0,
                wanderInterval: 3 + Math.random() * 3,
                velocity: new THREE.Vector3(0, 0, 0),
                health: 3,
                isAlive: true
            };
        }

        const DUMMY_BOUNDS = { minX: -45, maxX: 45, minZ: -55, maxZ: 5 };
        const dummies = [];
        for(let i = 0; i < 3; i++) {
            let x, z, valid;
            do {
                valid = true;
                x = DUMMY_BOUNDS.minX + Math.random() * (DUMMY_BOUNDS.maxX - DUMMY_BOUNDS.minX);
                z = DUMMY_BOUNDS.minZ + Math.random() * (DUMMY_BOUNDS.maxZ - DUMMY_BOUNDS.minZ);
                for(const c of colliders) {
                    if(x > c.minX - 3 && x < c.maxX + 3 && z > c.minZ - 3 && z < c.maxZ + 3) {
                        valid = false;
                        break;
                    }
                }
            } while(!valid);
            dummies.push(createDummy(x, z));
        }

        const targets = [];
        const tGeo = new THREE.IcosahedronGeometry(0.8, 0);
        const tMat = new THREE.MeshStandardMaterial({color: 0xff3300, emissive: 0xff0000, emissiveIntensity: 0.6});
        for(let i=0; i<8; i++) {
            const t = new THREE.Mesh(tGeo, tMat);
            t.position.set(
                DUMMY_BOUNDS.minX + Math.random() * (DUMMY_BOUNDS.maxX - DUMMY_BOUNDS.minX),
                2 + Math.random() * 4,
                DUMMY_BOUNDS.minZ + Math.random() * (DUMMY_BOUNDS.maxZ - DUMMY_BOUNDS.minZ)
            );
            scene.add(t);
            targets.push(t);
        }

        const weapons = {
            pistol: { maxAmmo: 15, reloadTime: 0.85, damage: 1, fireRate: 0.06, spreadAngle: 0.02, isAutomatic: true },
            rifle: { maxAmmo: 30, reloadTime: 1.2, damage: 2, fireRate: 0.08, spreadAngle: 0.01, isAutomatic: true },
            shotgun: { maxAmmo: 8, reloadTime: 1.5, damage: 3, fireRate: 0.6, spreadAngle: 0.1, isAutomatic: false }
        };

        let currentWeapon = 'pistol';
        let ammo = weapons[currentWeapon].maxAmmo;
        let isReloading = false;
        let reloadTimer = 0;
        let isFiring = false;

        const gunGroup = new THREE.Group();
        let currentGunModel;

        function createGunModel(type) {
            if (currentGunModel) gunGroup.remove(currentGunModel);

            const gunContainer = new THREE.Group();
            const gunMat = new THREE.MeshStandardMaterial({ color: 0x1d1d1d, metalness: 0.75, roughness: 0.35 });
            const darkMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, metalness: 0.8, roughness: 0.3 });
            const woodMat = new THREE.MeshStandardMaterial({ color: 0x4f3f24, roughness: 0.9 });
            const metalMat = new THREE.MeshStandardMaterial({ color: 0x6b6b6b, metalness: 0.9, roughness: 0.25 });

            if (type === 'pistol') {
                const body = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.14, 0.36), gunMat);
                body.position.set(0, 0, -0.04);
                gunContainer.add(body);

                const grip = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.18, 0.09), woodMat);
                grip.position.set(0, -0.13, 0.1);
                gunContainer.add(grip);

                const slide = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.2), darkMat);
                slide.position.set(0, 0.08, -0.15);
                gunContainer.add(slide);

                const muzzle = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.12, 10), metalMat);
                muzzle.rotation.z = Math.PI / 2;
                muzzle.position.set(0, 0, -0.26);
                gunContainer.add(muzzle);
            } else if (type === 'rifle') {
                const lower = new THREE.Mesh(new THREE.BoxGeometry(0.17, 0.14, 0.9), gunMat);
                lower.position.set(0, 0, -0.15);
                gunContainer.add(lower);

                const upper = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.08, 0.6), darkMat);
                upper.position.set(0, 0.09, -0.05);
                gunContainer.add(upper);

                const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.034, 0.034, 0.9, 12), metalMat);
                barrel.rotation.z = Math.PI / 2;
                barrel.position.set(0.08, 0.02, -0.55);
                gunContainer.add(barrel);

                const stock = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.12, 0.28), woodMat);
                stock.position.set(0, -0.02, 0.4);
                gunContainer.add(stock);

                const grip = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.2, 0.08), woodMat);
                grip.position.set(0, -0.17, 0.12);
                gunContainer.add(grip);

                const scope = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.18, 12), darkMat);
                scope.rotation.z = Math.PI / 2;
                scope.position.set(0.03, 0.12, -0.1);
                gunContainer.add(scope);

                const scopeGlass = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.05, 0.05), new THREE.MeshStandardMaterial({ color: 0x88b8ff, emissive: 0x1d4ed8, emissiveIntensity: 0.5 }));
                scopeGlass.position.set(0.08, 0.12, -0.1);
                gunContainer.add(scopeGlass);
            } else if (type === 'shotgun') {
                const body = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.14, 0.7), gunMat);
                body.position.set(0, 0, -0.06);
                gunContainer.add(body);

                const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.82, 14), metalMat);
                barrel.rotation.z = Math.PI / 2;
                barrel.position.set(0.07, 0.02, -0.52);
                gunContainer.add(barrel);

                const stock = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.14, 0.32), woodMat);
                stock.position.set(0, -0.02, 0.42);
                gunContainer.add(stock);

                const grip = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.2, 0.1), woodMat);
                grip.position.set(0, -0.17, 0.1);
                gunContainer.add(grip);

                const pump = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.08, 0.18), darkMat);
                pump.position.set(0.02, 0.08, 0.08);
                gunContainer.add(pump);

                const trigger = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.04, 0.04), darkMat);
                trigger.position.set(0, 0.02, 0.18);
                gunContainer.add(trigger);
            }

            gunContainer.position.set(0.32, -0.28, -0.5);
            gunGroup.add(gunContainer);
            currentGunModel = gunContainer;
        }

        createGunModel('pistol');
        camera.add(gunGroup);
        scene.add(camera);

        let yaw = 0, pitch = 0, velocityY = 0, isGrounded = true;
        let moveF = 0, moveR = 0;
        const playerPos = new THREE.Vector3(0, 1.6, 10);
        const MOVE_SPEED = 0.15;
        const PLAYER_RADIUS = 0.5;

        const reloadUI = document.getElementById('reload-container');
        const reloadBar = document.getElementById('reload-bar-fill');

        const minimapCanvas = document.getElementById('minimap');
        const minimapCtx = minimapCanvas.getContext('2d');
        minimapCanvas.width = 150;
        minimapCanvas.height = 150;
        const MINIMAP_SCALE = 1.5 / 150;

        function updateMinimap() {
            minimapCtx.fillStyle = '#2a2a2a';
            minimapCtx.fillRect(0, 0, minimapCanvas.width, minimapCanvas.height);

            minimapCtx.strokeStyle = '#444444';
            minimapCtx.lineWidth = 0.5;
            for(let i = 0; i <= 10; i++) {
                minimapCtx.beginPath();
                minimapCtx.moveTo(i * 15, 0);
                minimapCtx.lineTo(i * 15, minimapCanvas.height);
                minimapCtx.stroke();
            }

            minimapCtx.fillStyle = '#8b7d72';
            for(const c of colliders) {
                const px = (c.minX + DUMMY_BOUNDS.maxX) * MINIMAP_SCALE;
                const py = (-c.minZ + DUMMY_BOUNDS.maxZ) * MINIMAP_SCALE;
                const pw = (c.maxX - c.minX) * MINIMAP_SCALE;
                const ph = (c.maxZ - c.minZ) * MINIMAP_SCALE;
                minimapCtx.fillRect(px, py, pw, ph);
            }

            minimapCtx.fillStyle = '#ff9999';
            for(const dummy of dummies) {
                if(!dummy.isAlive) continue;
                const px = (dummy.group.position.x + DUMMY_BOUNDS.maxX) * MINIMAP_SCALE;
                const py = (-dummy.group.position.z + DUMMY_BOUNDS.maxZ) * MINIMAP_SCALE;
                minimapCtx.beginPath();
                minimapCtx.arc(px, py, 3, 0, Math.PI * 2);
                minimapCtx.fill();
            }

            minimapCtx.fillStyle = '#00ff00';
            const playerPx = (playerPos.x + DUMMY_BOUNDS.maxX) * MINIMAP_SCALE;
            const playerPy = (-playerPos.z + DUMMY_BOUNDS.maxZ) * MINIMAP_SCALE;
            minimapCtx.beginPath();
            minimapCtx.arc(playerPx, playerPy, 4, 0, Math.PI * 2);
            minimapCtx.fill();

            minimapCtx.strokeStyle = '#00ff00';
            minimapCtx.lineWidth = 2;
            minimapCtx.beginPath();
            minimapCtx.moveTo(playerPx, playerPy);
            const dirX = Math.sin(yaw) * 8;
            const dirZ = Math.cos(yaw) * 8;
            minimapCtx.lineTo(playerPx + dirX, playerPy - dirZ);
            minimapCtx.stroke();
        }

        const keys = {};
        window.addEventListener('keydown', e => {
            keys[e.key.toLowerCase()] = true;
            if (e.key === ' ') {
                e.preventDefault();
                if (isGrounded) {
                    velocityY = 0.36;
                    isGrounded = false;
                }
            }
            if (e.key.toLowerCase() === 'r') {
                e.preventDefault();
                startReload();
            }
            if (e.key.toLowerCase() === 'e') {
                e.preventDefault();
                swapWeapon();
            }
        });
        window.addEventListener('keyup', e => {
            keys[e.key.toLowerCase()] = false;
        });

        renderer.domElement.addEventListener('click', () => {
            if (!isMobile && document.body.requestPointerLock) {
                document.body.requestPointerLock();
            }
        });

        document.addEventListener('mousemove', e => {
            if (document.pointerLockElement === document.body) {
                yaw -= e.movementX * 0.005;
                pitch -= e.movementY * 0.005;
                pitch = Math.max(-1.45, Math.min(1.45, pitch));
            }
        });

        renderer.domElement.addEventListener('mousedown', () => {
            if (!isMobile) isFiring = true;
        });
        renderer.domElement.addEventListener('mouseup', () => {
            isFiring = false;
        });

        const touchState = { lookTouchId: null, lookStartX: null, lookStartY: null };

        window.addEventListener('touchstart', e => {
            for (const touch of e.touches) {
                const triggerPoint = isTablet ? window.innerWidth * 0.4 : window.innerWidth / 2;
                if (touch.clientX > triggerPoint && touchState.lookTouchId === null) {
                    touchState.lookTouchId = touch.identifier;
                    touchState.lookStartX = touch.clientX;
                    touchState.lookStartY = touch.clientY;
                    break;
                }
            }
        });

        window.addEventListener('touchmove', e => {
            for (const touch of e.touches) {
                if (touch.identifier === touchState.lookTouchId) {
                    yaw -= (touch.clientX - touchState.lookStartX) * 0.0055;
                    pitch -= (touch.clientY - touchState.lookStartY) * 0.0055;
                    pitch = Math.max(-1.45, Math.min(1.45, pitch));
                    touchState.lookStartX = touch.clientX;
                    touchState.lookStartY = touch.clientY;
                    break;
                }
            }
        });

        window.addEventListener('touchend', e => {
            for (const touch of e.changedTouches) {
                if (touch.identifier === touchState.lookTouchId) {
                    touchState.lookTouchId = null;
                    break;
                }
            }
        });

        const joy = document.getElementById('joystick-container');
        const knob = document.getElementById('joystick-knob');
        let joyTouchId = null;

        joy.addEventListener('touchstart', e => {
            if (joyTouchId === null && e.touches.length > 0) {
                joyTouchId = e.touches[0].identifier;
            }
        });

        joy.addEventListener('touchmove', e => {
            e.preventDefault();
            for (const touch of e.touches) {
                if (touch.identifier === joyTouchId) {
                    const r = joy.getBoundingClientRect();
                    const dx = touch.clientX - (r.left + r.width / 2);
                    const dy = touch.clientY - (r.top + r.height / 2);
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const d = Math.min(dist, 50);
                    const a = dist > 0 ? Math.atan2(dy, dx) : 0;
                    knob.style.transform = `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d}px)`;
                    moveR = (d / 50) * Math.cos(a);
                    moveF = -(d / 50) * Math.sin(a);
                    break;
                }
            }
        });

        joy.addEventListener('touchend', e => {
            for (const touch of e.changedTouches) {
                if (touch.identifier === joyTouchId) {
                    moveF = 0;
                    moveR = 0;
                    knob.style.transform = 'translate(0,0)';
                    joyTouchId = null;
                    break;
                }
            }
        });

        const ray = new THREE.Raycaster();
        let lastShotTime = 0;

        function shoot() {
            const weapon = weapons[currentWeapon];
            if (ammo <= 0 || isReloading) return;
            const now = Date.now() / 1000;
            if (now - lastShotTime < weapon.fireRate) return;

            lastShotTime = now;
            ammo--;
            document.getElementById('ammo-display').innerText = `${ammo} / ${weapon.maxAmmo}`;
            gunGroup.position.z += 0.22;

            ray.setFromCamera(new THREE.Vector2(0, 0), camera);

            const hits = ray.intersectObjects(targets);
            if (hits.length > 0) {
                const o = hits[0].object;
                o.scale.set(0, 0, 0);
                setTimeout(() => {
                    o.scale.set(1, 1, 1);
                    let newX, newZ, valid;
                    do {
                        valid = true;
                        newX = DUMMY_BOUNDS.minX + Math.random() * (DUMMY_BOUNDS.maxX - DUMMY_BOUNDS.minX);
                        newZ = DUMMY_BOUNDS.minZ + Math.random() * (DUMMY_BOUNDS.maxZ - DUMMY_BOUNDS.minZ);
                        for (const c of colliders) {
                            if (newX > c.minX - 2 && newX < c.maxX + 2 && newZ > c.minZ - 2 && newZ < c.maxZ + 2) {
                                valid = false;
                                break;
                            }
                        }
                    } while (!valid);
                    o.position.set(newX, 2 + Math.random() * 4, newZ);
                }, 2000);
            }

            for (const dummy of dummies) {
                if (!dummy.isAlive) continue;
                const allMeshes = [dummy.body, dummy.leftArm, dummy.rightArm, dummy.leftLeg, dummy.rightLeg];
                const dummyHits = ray.intersectObjects(allMeshes);
                if (dummyHits.length > 0) {
                    dummy.health -= weapon.damage;
                    if (dummy.health <= 0) {
                        dummy.isAlive = false;
                        dummy.group.scale.set(0, 0, 0);
                    }
                    return;
                }
            }
        }

        function swapWeapon() {
            const weaponList = ['pistol', 'rifle', 'shotgun'];
            const currentIndex = weaponList.indexOf(currentWeapon);
            currentWeapon = weaponList[(currentIndex + 1) % weaponList.length];
            ammo = weapons[currentWeapon].maxAmmo;
            isReloading = false;
            isFiring = false;
            reloadUI.style.display = 'none';
            gunGroup.position.y = 0;
            gunGroup.position.z = 0;

            document.getElementById('weapon-display').innerText = currentWeapon.toUpperCase();
            document.getElementById('ammo-display').innerText = `${ammo} / ${weapons[currentWeapon].maxAmmo}`;
            createGunModel(currentWeapon);
        }

        function startReload() {
            const weapon = weapons[currentWeapon];
            if (!isReloading && ammo < weapon.maxAmmo) {
                isReloading = true;
                isFiring = false;
                reloadTimer = 0;
                reloadUI.style.display = 'block';
            }
        }

        document.getElementById('fire-button').addEventListener('touchstart', e => {
            e.preventDefault();
            isFiring = true;
        });
        document.getElementById('fire-button').addEventListener('touchend', e => {
            e.preventDefault();
            isFiring = false;
        });
        document.getElementById('jump-button').addEventListener('touchstart', e => {
            e.preventDefault();
            if (isGrounded) {
                velocityY = 0.36;
                isGrounded = false;
            }
        });
        document.getElementById('weapon-swap-button').addEventListener('touchstart', e => {
            e.preventDefault();
            swapWeapon();
        });
        document.getElementById('reload-button').addEventListener('touchstart', e => {
            e.preventDefault();
            startReload();
        });

        function checkCollision(x, z, radius) {
            for (const c of colliders) {
                const closestX = Math.max(c.minX, Math.min(x, c.maxX));
                const closestZ = Math.max(c.minZ, Math.min(z, c.maxZ));
                const distX = x - closestX;
                const distZ = z - closestZ;
                const distSq = distX * distX + distZ * distZ;

                if (distSq < radius * radius) {
                    return true;
                }
            }
            return false;
        }

        function updateDummies(delta) {
            for (const dummy of dummies) {
                if (!dummy.isAlive) continue;

                dummy.wanderTimer += delta;
                if (dummy.wanderTimer > dummy.wanderInterval) {
                    dummy.moveDir = Math.random() * Math.PI * 2;
                    dummy.wanderInterval = 2 + Math.random() * 4;
                    dummy.wanderTimer = 0;
                }

                const moveSpeed = 0.08;
                let newX = dummy.group.position.x + Math.cos(dummy.moveDir) * moveSpeed;
                let newZ = dummy.group.position.z + Math.sin(dummy.moveDir) * moveSpeed;

                newX = Math.max(DUMMY_BOUNDS.minX, Math.min(newX, DUMMY_BOUNDS.maxX));
                newZ = Math.max(DUMMY_BOUNDS.minZ, Math.min(newZ, DUMMY_BOUNDS.maxZ));

                if (!checkCollision(newX, newZ, 0.35)) {
                    dummy.group.position.x = newX;
                    dummy.group.position.z = newZ;
                    dummy.group.rotation.y = dummy.moveDir;
                } else {
                    dummy.moveDir = Math.random() * Math.PI * 2;
                }

                const walkCycle = (Date.now() * 0.01) % (Math.PI * 2);
                dummy.leftArm.rotation.z = Math.sin(walkCycle) * 0.3;
                dummy.rightArm.rotation.z = Math.sin(walkCycle + Math.PI) * 0.3;
                dummy.leftLeg.rotation.x = Math.sin(walkCycle) * 0.2;
                dummy.rightLeg.rotation.x = Math.sin(walkCycle + Math.PI) * 0.2;
            }
        }

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));

            if (!isMobile) {
                moveF = 0;
                moveR = 0;
                if (keys['w']) moveF += 1;
                if (keys['s']) moveF -= 1;
                if (keys['a']) moveR -= 1;
                if (keys['d']) moveR += 1;
            }

            const fw = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            fw.y = 0;
            fw.normalize();
            const rt = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), fw).negate();

            const moveVec = new THREE.Vector3(
                fw.x * moveF + rt.x * moveR,
                0,
                fw.z * moveF + rt.z * moveR
            ).multiplyScalar(MOVE_SPEED);

            const nX = playerPos.x + moveVec.x;
            const nZ = playerPos.z + moveVec.z;

            if (!checkCollision(nX, playerPos.z, PLAYER_RADIUS)) {
                playerPos.x = nX;
            }
            if (!checkCollision(playerPos.x, nZ, PLAYER_RADIUS)) {
                playerPos.z = nZ;
            }

            velocityY -= 0.019;
            playerPos.y += velocityY;
            if (playerPos.y <= 1.6) {
                playerPos.y = 1.6;
                velocityY = 0;
                isGrounded = true;
            }

            if (isFiring && !isReloading) {
                shoot();
            }

            const weapon = weapons[currentWeapon];
            if (isReloading) {
                reloadTimer += delta;
                const p = Math.min(reloadTimer / weapon.reloadTime, 1);
                reloadBar.style.width = (p * 100) + '%';
                gunGroup.position.y = Math.sin(p * Math.PI) * -0.65;
                if (reloadTimer >= weapon.reloadTime) {
                    isReloading = false;
                    ammo = weapon.maxAmmo;
                    document.getElementById('ammo-display').innerText = `${ammo} / ${weapon.maxAmmo}`;
                    reloadUI.style.display = 'none';
                    gunGroup.position.y = 0;
                }
            } else {
                gunGroup.position.y = Math.sin(Date.now() * 0.0025) * 0.015;
                gunGroup.position.z += (0 - gunGroup.position.z) * 0.18;
            }

            updateDummies(delta);
            updateMinimap();
            camera.position.copy(playerPos);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
