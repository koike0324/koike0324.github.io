<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Backrooms FPS</title>
    <style>
        html, body {
            margin: 0; overflow: hidden; touch-action: none; background: #1a1a1a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            position: relative;
        }
        canvas {
            display: block;
            width: 100vw; height: 100vh;
        }

        #home-screen {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            background: rgba(10, 10, 10, 0.9);
            z-index: 10;
        }
        .panel {
            width: min(560px, 86vw);
            padding: 34px 28px;
            border: 2px solid rgba(255,255,255,0.26);
            background: rgba(18,18,18,0.84);
            box-shadow: 0 0 32px rgba(0,0,0,0.72);
            text-align: center;
        }
        .panel h1 {
            margin: 0 0 20px;
            font-size: clamp(32px, 5vw, 58px);
            letter-spacing: 4px;
            color: #f2e7a0;
            text-shadow: 0 0 18px rgba(255, 230, 120, 0.3);
        }
        .panel p {
            color: #d2d2d2;
            line-height: 1.8;
            font-size: 14px;
            margin: 12px 0;
        }
        .panel .start-button {
            margin-top: 18px;
            display: inline-block;
            background: #d4b95a;
            color: #111;
            border: none;
            padding: 14px 32px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 2px;
        }
        .panel .start-button:hover { background: #f0d878; }

        #ui-layer { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
        #crosshair {
            position:absolute; top:50%; left:50%; width:18px; height:18px;
            border:2px solid rgba(255,255,255,0.8); border-radius:50%;
            transform: translate(-50%, -50%);
        }
        #crosshair::before, #crosshair::after {
            content:''; position:absolute; background: rgba(255,255,255,0.8);
        }
        #crosshair::before { left:50%; top:-6px; width:2px; height:30px; transform:translateX(-50%); }
        #crosshair::after { top:50%; left:-6px; width:30px; height:2px; transform:translateY(-50%); }

        #minimap-container {
            position:absolute; top:20px; right:20px; width:150px; height:150px;
            background: rgba(0,0,0,0.7); border:2px solid rgba(255,255,255,0.5); border-radius:4px; pointer-events:none;
        }
        #minimap { width:100%; height:100%; }

        .btn {
            position:absolute; pointer-events:auto; border-radius:50%; display:flex; align-items:center; justify-content:center;
            color:white; font-weight:700; user-select:none; border:2px solid rgba(255,255,255,0.4); background:rgba(0,0,0,0.3);
            transition:transform 0.05s;
        }
        .btn:active { transform: scale(0.9); background: rgba(0,0,0,0.5); }

        #joystick-container {
            bottom:40px; left:40px; width:130px; height:130px; border-radius:50%; border:2px solid rgba(255,255,255,0.2);
            position:absolute; pointer-events:auto; background: rgba(255,255,255,0.08); display:none;
        }
        #joystick-container.mobile-visible { display:block; }
        #joystick-knob {
            position:absolute; top:40px; left:40px; width:50px; height:50px; background: rgba(255,255,255,0.4); border-radius:50%;
        }

        #fire-button { bottom:140px; right:40px; width:100px; height:100px; background: rgba(255,80,80,0.75); font-size:20px; display:none; }
        #fire-button.mobile-visible { display:flex; }
        #jump-button { bottom:40px; right:160px; width:80px; height:80px; background: rgba(50,150,255,0.6); display:none; }
        #jump-button.mobile-visible { display:flex; }
        #reload-button { bottom:40px; right:40px; width:80px; height:80px; background: rgba(80,80,80,0.8); font-size:13px; display:none; }
        #reload-button.mobile-visible { display:flex; }

        #ammo-display { position:absolute; top:20px; left:20px; font-size:28px; font-weight:bold; color:#fff; text-shadow:1px 1px 0 rgba(0,0,0,0.8); }
        #notice {
            position:absolute; bottom:20px; left:50%; transform:translateX(-50%); color:#fff;
            background: rgba(0,0,0,0.5); padding:8px 14px; border-radius:8px;
            font-size:12px; letter-spacing:1px; opacity:0; transition: opacity .3s ease;
        }
        #notice.show { opacity:1; }

        #controls-guide {
            position:absolute; bottom:20px; right:20px; color:#fff; font-size:12px;
            background: rgba(0,0,0,0.7); padding:10px 15px; border-radius:8px; text-align:right; line-height:1.6;
        }
        #controls-guide.hidden { display:none; }

        @supports (padding: max(0px)) {
            #joystick-container { bottom: max(40px, env(safe-area-inset-bottom)); left: max(40px, env(safe-area-inset-left)); }
            #fire-button { bottom: max(140px, calc(140px + env(safe-area-inset-bottom))); right: max(40px, env(safe-area-inset-right)); }
            #jump-button { bottom: max(40px, env(safe-area-inset-bottom)); right: max(160px, calc(160px + env(safe-area-inset-right))); }
            #reload-button { bottom: max(40px, env(safe-area-inset-bottom)); right: max(40px, env(safe-area-inset-right)); }
            #controls-guide { bottom: max(20px, env(safe-area-inset-bottom)); right: max(20px, env(safe-area-inset-right)); }
            #ammo-display { top: max(20px, env(safe-area-inset-top)); left: max(20px, env(safe-area-inset-left)); }
            #minimap-container { top:max(20px, env(safe-area-inset-top)); right:max(20px, env(safe-area-inset-right)); }
        }

        @media (max-width: 820px) {
            #controls-guide { display:none; }
            #joystick-container { display:block; }
            #fire-button, #jump-button, #reload-button { display:flex; }
        }
    </style>
</head>
<body>
    <div id="home-screen">
        <div class="panel">
            <h1>BACKROOMS</h1>
            <p>あなたは黄色い廊下の中で目を覚ます。<br>ここは出口のない空間で、何かがいつも見ている。</p>
            <p>WASD / 矢印キー: 移動<br>マウス: 視点操作<br>クリック: 攻撃<br>Space: ジャンプ<br>R: リロード</p>
            <button class="start-button" id="start-button">ENTER</button>
        </div>
    </div>

    <div id="ui-layer">
        <div id="crosshair"></div>
        <div id="ammo-display">15 / 15</div>
        <div id="minimap-container"><canvas id="minimap"></canvas></div>
        <div id="joystick-container"><div id="joystick-knob"></div></div>
        <div id="fire-button" class="btn">FIRE</div>
        <div id="jump-button" class="btn">JUMP</div>
        <div id="reload-button" class="btn">RELOAD</div>
        <div id="controls-guide">
            <div>WASD: 移動</div>
            <div>Mouse: 視点</div>
            <div>Click: 射撃</div>
            <div>Space: ジャンプ</div>
            <div>R: リロード</div>
        </div>
        <div id="notice">LIGHTS OUT</div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const homeScreen = document.getElementById('home-screen');
        const startButton = document.getElementById('start-button');
        const notice = document.getElementById('notice');
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        let started = false;
        startButton.addEventListener('click', () => {
            homeScreen.style.display = 'none';
            started = true;
            if (document.body.requestPointerLock) document.body.requestPointerLock();
            notice.classList.add('show');
            setTimeout(() => notice.classList.remove('show'), 1200);
        });

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x404f36);
        scene.fog = new THREE.Fog(0x404f36, 16, 80);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const hemiLight = new THREE.HemisphereLight(0xb9c7af, 0x241d1a, 1.2);
        scene.add(hemiLight);

        const flashlight = new THREE.SpotLight(0xf5f1c7, 5.0, 35, Math.PI / 7, 0.75, 1.2);
        flashlight.position.set(0, 1.4, 0);
        flashlight.target.position.set(0, 0, -5);
        flashlight.castShadow = false;
        scene.add(flashlight);
        scene.add(flashlight.target);

        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(180, 180),
            new THREE.MeshStandardMaterial({ color: 0x8b8a4c, roughness: 0.92, metalness: 0.05 })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = 0;
        scene.add(floor);

        const ceiling = new THREE.Mesh(
            new THREE.PlaneGeometry(180, 180),
            new THREE.MeshStandardMaterial({ color: 0xd7d08f, roughness: 0.9 })
        );
        ceiling.rotation.x = Math.PI / 2;
        ceiling.position.y = 4.5;
        scene.add(ceiling);

        const wallMat = new THREE.MeshStandardMaterial({ color: 0x687b4f, roughness: 0.98 });
        const wallMat2 = new THREE.MeshStandardMaterial({ color: 0x5c6b42, roughness: 1 });
        const colliders = [];

        function addWall(x, z, w, d, h, mat = wallMat) {
            const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            wall.position.set(x, h/2, z);
            scene.add(wall);
            colliders.push({
                minX: x - w/2, maxX: x + w/2,
                minZ: z - d/2, maxZ: z + d/2,
                width: w, height: h, depth: d
            });
        }

        // endless hallways create backrooms feel
        const hallLength = 80;
        for (let i = -hallLength; i <= hallLength; i += 12) {
            if (Math.abs(i) < 20) continue;
            addWall(-20, i, 1.5, 10, 4.5, wallMat2);
            addWall(20, i, 1.5, 10, 4.5, wallMat2);
        }

        addWall(0, -40, 38, 2, 4.5);
        addWall(0, 40, 38, 2, 4.5);
        addWall(-25, -10, 2, 60, 4.5);
        addWall(25, -10, 2, 60, 4.5);
        addWall(-30, 18, 2, 40, 4.5);
        addWall(30, 18, 2, 40, 4.5);

        const dummyMat = new THREE.MeshStandardMaterial({ color: 0x7fa0d0, emissive: 0x0a0e1a, emissiveIntensity: 0.3 });
        const entityGroup = new THREE.Group();
        const entityBody = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.7, 0.6), dummyMat);
        entityBody.position.y = 0.9;
        entityGroup.add(entityBody);
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.32, 18, 18), new THREE.MeshStandardMaterial({ color: 0xdcdcdc }));
        head.position.y = 1.9;
        entityGroup.add(head);
        scene.add(entityGroup);
        entityGroup.visible = false;

        const playerPos = new THREE.Vector3(0, 1.5, 18);
        const velocity = new THREE.Vector3();
        let yaw = 0, pitch = 0, jumpVel = 0;
        let grounded = true;
        let moveF = 0, moveR = 0;

        const targets = [];
        const targetMat = new THREE.MeshStandardMaterial({ color: 0xff3b30, emissive: 0xff0000, emissiveIntensity: 0.5 });
        for (let i = 0; i < 8; i++) {
            const target = new THREE.Mesh(new THREE.IcosahedronGeometry(0.6, 0), targetMat);
            const x = -22 + Math.random() * 44;
            const z = -34 + Math.random() * 68;
            target.position.set(x, 1.8 + Math.random() * 2.5, z);
            scene.add(target);
            targets.push(target);
        }

        let ammo = 15;
        let reloading = false;
        const RELOAD_TIME = 0.9;
        let reloadTimer = 0;
        const ammoDisplay = document.getElementById('ammo-display');
        const minimapCanvas = document.getElementById('minimap');
        const minimapCtx = minimapCanvas.getContext('2d');
        minimapCanvas.width = 150;
        minimapCanvas.height = 150;

        function updateAmmo() {
            ammoDisplay.textContent = `${ammo} / 15`;
        }
        updateAmmo();

        function updateMinimap() {
            minimapCtx.clearRect(0,0,150,150);
            minimapCtx.fillStyle = '#1a1a1a';
            minimapCtx.fillRect(0,0,150,150);
            minimapCtx.strokeStyle = '#666';
            minimapCtx.lineWidth = 1;
            for (let x = 0; x <= 150; x += 15) {
                minimapCtx.beginPath(); minimapCtx.moveTo(x,0); minimapCtx.lineTo(x,150); minimapCtx.stroke();
            }
            for (let y = 0; y <= 150; y += 15) {
                minimapCtx.beginPath(); minimapCtx.moveTo(0,y); minimapCtx.lineTo(150,y); minimapCtx.stroke();
            }

            minimapCtx.fillStyle = '#8b7d72';
            for (const c of colliders) {
                const px = ((c.minX + 50) / 100) * 150;
                const py = ((-c.minZ + 50) / 100) * 150;
                const pw = (c.width / 100) * 150;
                const ph = (c.depth / 100) * 150;
                minimapCtx.fillRect(px, py, pw, ph);
            }

            minimapCtx.fillStyle = '#00ff66';
            const px = ((playerPos.x + 50) / 100) * 150;
            const py = ((-playerPos.z + 50) / 100) * 150;
            minimapCtx.beginPath(); minimapCtx.arc(px, py, 5, 0, Math.PI * 2); minimapCtx.fill();
            minimapCtx.strokeStyle = '#00ff66';
            minimapCtx.beginPath(); minimapCtx.moveTo(px, py); minimapCtx.lineTo(px + Math.sin(yaw) * 10, py - Math.cos(yaw) * 10); minimapCtx.stroke();
        }

        function startReload() {
            if (!reloading && ammo < 15) {
                reloading = true;
                reloadTimer = 0;
            }
        }

        function shoot() {
            if (!started) return;
            if (ammo <= 0 || reloading) return;
            ammo -= 1;
            updateAmmo();

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            const hitTargets = raycaster.intersectObjects(targets, false);
            if (hitTargets.length > 0) {
                const target = hitTargets[0].object;
                target.position.set(-20 + Math.random() * 40, 1.6 + Math.random() * 2.8, -30 + Math.random() * 60);
            }

            const entityPos = entityGroup.position.clone();
            const toEntity = entityPos.sub(camera.position);
            const distance = toEntity.length();
            if (distance < 12) {
                entityGroup.visible = true;
                entityGroup.position.y = 0;
                entityGroup.position.x = camera.position.x + Math.sin(yaw) * 2.5;
                entityGroup.position.z = camera.position.z + Math.cos(yaw) * 2.5;
            }
        }

        function checkCollision(x, z, radius = 0.7) {
            for (const c of colliders) {
                const closestX = Math.max(c.minX, Math.min(x, c.maxX));
                const closestZ = Math.max(c.minZ, Math.min(z, c.maxZ));
                const dx = x - closestX;
                const dz = z - closestZ;
                if (dx * dx + dz * dz < radius * radius) return true;
            }
            return false;
        }

        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            if (k === ' ') {
                e.preventDefault();
                if (grounded) { jumpVel = 0.45; grounded = false; }
            }
            if (k === 'r') startReload();
            if (['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) {
                e.preventDefault();
            }
            if (k === 'w' || k === 'arrowup') moveF = 1;
            if (k === 's' || k === 'arrowdown') moveF = -1;
            if (k === 'a' || k === 'arrowleft') moveR = -1;
            if (k === 'd' || k === 'arrowright') moveR = 1;
        });

        window.addEventListener('keyup', (e) => {
            const k = e.key.toLowerCase();
            if (k === 'w' || k === 'arrowup') moveF = 0;
            if (k === 's' || k === 'arrowdown') moveF = 0;
            if (k === 'a' || k === 'arrowleft') moveR = 0;
            if (k === 'd' || k === 'arrowright') moveR = 0;
        });

        document.addEventListener('mousemove', (e) => {
            if (started && document.pointerLockElement === document.body) {
                yaw -= e.movementX * 0.0036;
                pitch -= e.movementY * 0.0036;
                pitch = Math.max(-1.4, Math.min(1.4, pitch));
            }
        });

        renderer.domElement.addEventListener('click', () => {
            if (!isMobile && started) shoot();
            if (document.body.requestPointerLock) document.body.requestPointerLock();
        });

        const touchState = { lookTouchId: null, x: 0, y: 0 };
        window.addEventListener('touchstart', (e) => {
            for (const t of e.touches) {
                const lookArea = window.innerWidth * 0.55;
                if (t.clientX > lookArea && touchState.lookTouchId === null) {
                    touchState.lookTouchId = t.identifier;
                    touchState.x = t.clientX;
                    touchState.y = t.clientY;
                    break;
                }
            }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            for (const t of e.touches) {
                if (t.identifier === touchState.lookTouchId) {
                    yaw -= (t.clientX - touchState.x) * 0.005;
                    pitch -= (t.clientY - touchState.y) * 0.005;
                    pitch = Math.max(-1.4, Math.min(1.4, pitch));
                    touchState.x = t.clientX;
                    touchState.y = t.clientY;
                    break;
                }
            }
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
            for (const t of e.changedTouches) {
                if (t.identifier === touchState.lookTouchId) touchState.lookTouchId = null;
            }
        });

        const joy = document.getElementById('joystick-container');
        const knob = document.getElementById('joystick-knob');
        let joyTouchId = null;

        if (isMobile) {
            joy.classList.add('mobile-visible');
            document.getElementById('fire-button').classList.add('mobile-visible');
            document.getElementById('jump-button').classList.add('mobile-visible');
            document.getElementById('reload-button').classList.add('mobile-visible');
            document.getElementById('controls-guide').classList.add('hidden');

            document.getElementById('fire-button').addEventListener('touchstart', (e) => { e.preventDefault(); shoot(); }, { passive: false });
            document.getElementById('jump-button').addEventListener('touchstart', (e) => { e.preventDefault(); if (grounded) { jumpVel = 0.45; grounded = false; } }, { passive: false });
            document.getElementById('reload-button').addEventListener('touchstart', (e) => { e.preventDefault(); startReload(); }, { passive: false });

            joy.addEventListener('touchstart', (e) => {
                if (joyTouchId === null && e.touches.length > 0) joyTouchId = e.touches[0].identifier;
            }, { passive: true });

            joy.addEventListener('touchmove', (e) => {
                e.preventDefault();
                for (const touch of e.touches) {
                    if (touch.identifier === joyTouchId) {
                        const r = joy.getBoundingClientRect();
                        const dx = touch.clientX - (r.left + r.width / 2);
                        const dy = touch.clientY - (r.top + r.height / 2);
                        const dist = Math.min(Math.hypot(dx, dy), 50);
                        const ang = dist > 0 ? Math.atan2(dy, dx) : 0;
                        knob.style.transform = `translate(${Math.cos(ang) * dist}px, ${Math.sin(ang) * dist}px)`;
                        moveR = (dist / 50) * Math.cos(ang);
                        moveF = -(dist / 50) * Math.sin(ang);
                        break;
                    }
                }
            }, { passive: false });

            joy.addEventListener('touchend', (e) => {
                for (const touch of e.changedTouches) {
                    if (touch.identifier === joyTouchId) {
                        moveR = 0; moveF = 0; knob.style.transform = 'translate(0,0)'; joyTouchId = null; break;
                    }
                }
            }, { passive: true });
        }

        function animate() {
            requestAnimationFrame(animate);

            if (started) {
                const forward = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw)).normalize();
                const right = new THREE.Vector3(forward.z, 0, -forward.x).normalize();

                const moveVec = new THREE.Vector3();
                moveVec.addScaledVector(forward, moveF);
                moveVec.addScaledVector(right, moveR);

                if (moveVec.lengthSq() > 0) {
                    moveVec.normalize().multiplyScalar(0.16);
                    const nx = playerPos.x + moveVec.x;
                    const nz = playerPos.z + moveVec.z;
                    if (!checkCollision(nx, playerPos.z, 0.7)) playerPos.x = nx;
                    if (!checkCollision(playerPos.x, nz, 0.7)) playerPos.z = nz;
                }

                playerPos.y += jumpVel;
                jumpVel -= 0.012;
                if (playerPos.y <= 1.5) {
                    playerPos.y = 1.5;
                    jumpVel = 0;
                    grounded = true;
                }

                const entityDistance = entityGroup.position.distanceTo(camera.position);
                if (entityDistance < 8) {
                    entityGroup.visible = true;
                    entityGroup.position.y = 0.1 + Math.sin(performance.now() * 0.005) * 0.3;
                    entityGroup.position.x = camera.position.x + Math.sin(yaw + Math.PI) * (entityDistance * 0.7);
                    entityGroup.position.z = camera.position.z + Math.cos(yaw + Math.PI) * (entityDistance * 0.7);
                    entityGroup.lookAt(camera.position.x, camera.position.y + 0.8, camera.position.z);
                } else {
                    entityGroup.visible = false;
                }

                if (reloading) {
                    reloadTimer += 1/60;
                    if (reloadTimer >= RELOAD_TIME) {
                        ammo = 15; updateAmmo(); reloading = false; reloadTimer = 0;
                    }
                }

                updateMinimap();
            }

            const dir = new THREE.Euler(pitch, yaw, 0, 'YXZ');
            camera.quaternion.setFromEuler(dir);
            camera.position.copy(playerPos);
            flashlight.position.copy(camera.position);
            flashlight.position.y += 0.2;
            flashlight.target.position.copy(camera.position).add(new THREE.Vector3(Math.sin(yaw), Math.sin(pitch) * 0.6, Math.cos(yaw)).multiplyScalar(6));
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        camera.position.copy(playerPos);
        animate();
    </script>
</body>
</html>
