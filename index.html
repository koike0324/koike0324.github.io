<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultimate Mobile FPS Arena</title>
    <style>
        html, body {
            width: 100%; height: 100%; margin: 0; overflow: hidden;
            -webkit-user-select: none; user-select: none;
            -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }
        body { position: fixed; inset: 0; background: #87CEEB; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #game-canvas {
            position: fixed; inset: 0; z-index: 0; display: block;
            touch-action: none; -webkit-user-select: none; user-select: none;
        }
        #ui-layer {
            position: fixed; z-index: 10; inset: 0; width: 100%; height: 100%; pointer-events: none;
            -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        }

        #minimap-container {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 150px;
            height: 150px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 4px;
            pointer-events: none;
        }
        #minimap {
            width: 100%;
            height: 100%;
        }

        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 18px; height: 18px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: "";
            position: absolute;
            left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.95);
            box-shadow: 0 0 6px rgba(255,255,255,0.9);
        }
        #crosshair::before {
            width: 2px; height: 18px;
        }
        #crosshair::after {
            width: 18px; height: 2px;
        }

        .btn {
            position: absolute; pointer-events: auto; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: bold;
            -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent; touch-action: none;
            border: 2px solid rgba(255,255,255,0.4);
            background: rgba(0,0,0,0.3); transition: transform 0.05s;
        }
        .btn:active { transform: scale(0.9); background: rgba(0,0,0,0.5); }

        #joystick-container {
            bottom: 40px; left: 40px; width: 130px; height: 130px;
            border-radius: 50%; border: 2px solid rgba(255,255,255,0.2);
            position: absolute; pointer-events: auto; background: rgba(255,255,255,0.1);
            display: none;
            touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        }
        #joystick-container.mobile-visible { display: block; }
        #joystick-knob {
            position: absolute; top: 40px; left: 40px; width: 50px; height: 50px;
            background: rgba(255,255,255,0.4); border-radius: 50%;
        }

        #fire-button { bottom: 140px; right: 40px; width: 100px; height: 100px; background: rgba(255, 50, 50, 0.6); font-size: 20px; display: none; }
        #fire-button.mobile-visible { display: flex; }
        #jump-button { bottom: 40px; right: 160px; width: 80px; height: 80px; background: rgba(50, 150, 255, 0.6); display: none; }
        #jump-button.mobile-visible { display: flex; }
        #reload-button { bottom: 40px; right: 40px; width: 80px; height: 80px; background: rgba(80, 80, 80, 0.8); font-size: 13px; display: none; }
        #reload-button.mobile-visible { display: flex; }

        #weapon-swap-button { bottom: 220px; right: 40px; width: 80px; height: 80px; background: rgba(255, 200, 0, 0.6); font-size: 12px; display: none; }
        #weapon-swap-button.mobile-visible { display: flex; }

        #reload-container {
            position: absolute; top: 58%; left: 50%; transform: translate(-50%, -50%);
            width: 140px; text-align: center; display: none;
        }
        #reload-text { color: #ff3300; font-weight: bold; font-size: 14px; margin-bottom: 5px; text-shadow: 1px 1px 2px black; }
        #reload-bar-bg { width: 100%; height: 8px; background: rgba(0,0,0,0.5); border-radius: 4px; overflow: hidden; }
        #reload-bar-fill { width: 0%; height: 100%; background: #00ffcc; }

        #ammo-display { position: absolute; top: 20px; left: 20px; font-size: 28px; font-weight: bold; color: #000; text-shadow: 1px 1px 2px rgba(255,255,255,0.8); }
        #weapon-display { position: absolute; top: 60px; left: 20px; font-size: 16px; font-weight: bold; color: #000; text-shadow: 1px 1px 2px rgba(255,255,255,0.8); }
        #aim-toggle {
            position: absolute; top: 190px; right: 20px; left: auto; z-index: 20;
            pointer-events: auto; cursor: pointer;
            padding: 9px 12px; border: 2px solid rgba(255,255,255,0.65);
            border-radius: 8px; background: rgba(35,35,35,0.78); color: white;
            font-size: 13px; font-weight: bold; letter-spacing: 0.3px;
            -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent; touch-action: manipulation;
        }
        #aim-toggle.enabled { background: rgba(20,125,65,0.9); }
        #ads-button { position:absolute; top:240px; right:20px; z-index:20; pointer-events:auto; cursor:pointer; padding:9px 14px; border:2px solid rgba(255,255,255,.65); border-radius:8px; background:rgba(25,45,70,.82); color:white; font-size:13px; font-weight:bold; touch-action:manipulation; }
        @media (max-width: 700px) {
            #ads-button { top:auto; bottom:242px; right:135px; }
        }
        #ads-button.enabled { background:rgba(20,125,65,.92); }
        #scope-overlay { display:none; position:fixed; inset:0; z-index:8; pointer-events:none; background:radial-gradient(circle at center, transparent 0 31vmin, rgba(0,0,0,.98) 31.5vmin, #000 100%); }
        #scope-overlay::before { content:""; position:absolute; left:50%; top:50%; width:64vmin; height:64vmin; transform:translate(-50%,-50%); border:2px solid rgba(0,0,0,.95); border-radius:50%; box-shadow:0 0 0 2px rgba(220,230,220,.45), inset 0 0 2px rgba(0,0,0,.9); }
        #scope-overlay::after { content:""; position:absolute; left:50%; top:50%; width:64vmin; height:64vmin; transform:translate(-50%,-50%); background:linear-gradient(transparent calc(50% - 1px),rgba(20,20,20,.9) 50%,transparent calc(50% + 1px)),linear-gradient(90deg,transparent calc(50% - 1px),rgba(20,20,20,.9) 50%,transparent calc(50% + 1px)); border-radius:50%; }

        #damage-indicators {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .damage-number {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            color: #ff0000;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }

        #controls-guide {
            position: absolute; bottom: 20px; right: 20px; color: #000; font-size: 12px;
            background: rgba(255,255,255,0.7); padding: 10px 15px; border-radius: 8px;
            text-align: right; line-height: 1.6;
        }
        #controls-guide.hidden { display: none; }

        @supports (padding: max(0px)) {
            #joystick-container {
                bottom: max(40px, env(safe-area-inset-bottom));
                left: max(40px, env(safe-area-inset-left));
            }
            #fire-button {
                bottom: max(140px, calc(140px + env(safe-area-inset-bottom)));
                right: max(40px, env(safe-area-inset-right));
            }
            #jump-button {
                bottom: max(40px, env(safe-area-inset-bottom));
                right: max(160px, calc(160px + env(safe-area-inset-right)));
            }
            #reload-button {
                bottom: max(40px, env(safe-area-inset-bottom));
                right: max(40px, env(safe-area-inset-right));
            }
            #weapon-swap-button {
                bottom: max(220px, calc(220px + env(safe-area-inset-bottom)));
                right: max(40px, env(safe-area-inset-right));
            }
            #controls-guide {
                bottom: max(20px, env(safe-area-inset-bottom));
                right: max(20px, env(safe-area-inset-right));
            }
            #ammo-display {
                top: max(20px, env(safe-area-inset-top));
                left: max(20px, env(safe-area-inset-left));
            }
            #weapon-display {
                top: max(60px, calc(60px + env(safe-area-inset-top)));
                left: max(20px, env(safe-area-inset-left));
            }
            #aim-toggle {
                top: max(190px, calc(190px + env(safe-area-inset-top)));
                right: max(20px, env(safe-area-inset-right));
                left: auto;
            }
            #minimap-container {
                top: max(20px, env(safe-area-inset-top));
                right: max(20px, env(safe-area-inset-right));
            }
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div id="crosshair"></div>
        <div id="ammo-display">15 / 15</div>
        <div id="weapon-display">PISTOL</div>
        <button id="aim-toggle" type="button" aria-pressed="false">AUTO AIM: OFF</button>
        <button id="ads-button" type="button" aria-pressed="false">AIM: OFF</button>
        <div id="scope-overlay" aria-hidden="true"></div>

        <div id="reload-container">
            <div id="reload-text">RELOADING</div>
            <div id="reload-bar-bg"><div id="reload-bar-fill"></div></div>
        </div>

        <div id="minimap-container">
            <canvas id="minimap"></canvas>
        </div>

        <div id="damage-indicators"></div>

        <div id="joystick-container"><div id="joystick-knob"></div></div>
        <div id="fire-button" class="btn">FIRE</div>
        <div id="jump-button" class="btn">JUMP</div>
        <div id="weapon-swap-button" class="btn">SWAP<br>GUN</div>
        <div id="reload-button" class="btn">RELOAD</div>

        <div id="controls-guide">
            <div>WASD: 移動</div>
            <div>Mouse: 視点</div>
            <div>Click: 射撃 / 右クリック長押し: 覗く</div>
            <div>Space: ジャンプ</div>
            <div>R: リロード</div>
            <div>E: 武器切り替え</div>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ゲーム中の長押し選択・コピー用メニュー・ダブルタップ拡大を防ぐ
        document.addEventListener('selectstart', e => e.preventDefault());
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('dblclick', e => e.preventDefault());

        // Edge / Safari の iPad は userAgent がPC扱いになることがあるため、タッチ対応も判定する
        const isIPadOS = /Macintosh/i.test(navigator.userAgent) && navigator.maxTouchPoints > 1;
        const hasTouchInput = (navigator.maxTouchPoints || 0) > 0 ||
            ('ontouchstart' in window) ||
            (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || isIPadOS || hasTouchInput;
        const isTablet = window.innerWidth > 600 && (isIPadOS || /iPad|Android/i.test(navigator.userAgent) || hasTouchInput);

        if(isMobile) {
            document.getElementById('joystick-container').classList.add('mobile-visible');
            document.getElementById('fire-button').classList.add('mobile-visible');
            document.getElementById('jump-button').classList.add('mobile-visible');
            document.getElementById('weapon-swap-button').classList.add('mobile-visible');
            document.getElementById('reload-button').classList.add('mobile-visible');
            document.getElementById('controls-guide').classList.add('hidden');
        } else {
            document.getElementById('controls-guide').classList.remove('hidden');
        }

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 15, 100);

        const getViewportSize = () => {
            // iPad Safari のアドレスバーや画面回転で変わる表示領域にも追従する
            const viewport = window.visualViewport;
            return {
                width: Math.max(1, Math.round(viewport?.width || document.documentElement.clientWidth || window.innerWidth)),
                height: Math.max(1, Math.round(viewport?.height || document.documentElement.clientHeight || window.innerHeight))
            };
        };

        const initialSize = getViewportSize();
        const camera = new THREE.PerspectiveCamera(75, initialSize.width / initialSize.height, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.domElement.id = 'game-canvas';
        renderer.domElement.style.cssText = 'position:fixed;inset:0;display:block;width:100%;height:100%;';
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(initialSize.width, initialSize.height, false);
        document.body.appendChild(renderer.domElement);

        const light = new THREE.HemisphereLight(0xffffff, 0x80bb88, 2);
        scene.add(light);

        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(380, 300),
            new THREE.MeshStandardMaterial({
                color: 0x2d8a3d,
                roughness: 0.8,
                side: THREE.DoubleSide,
                map: new THREE.CanvasTexture((function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = canvas.height = 64;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#2d8a3d';
                    ctx.fillRect(0, 0, 64, 64);
                    for(let i = 0; i < 200; i++) {
                        ctx.fillStyle = Math.random() > 0.7 ? '#1f6a2a' : '#3a9a47';
                        ctx.fillRect(Math.random()*64, Math.random()*64, Math.random()*4+1, Math.random()*4+1);
                    }
                    return canvas;
                })())
            })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.position.z = -60; // 拡張したマップ全体を地面で覆う
        scene.add(floor);

        function addTree(x, z) {
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.5, 3, 8), new THREE.MeshStandardMaterial({color: 0x8B4513}));
            trunk.position.set(x, 1.5, z);
            scene.add(trunk);

            const foliage = new THREE.Mesh(new THREE.SphereGeometry(2, 8, 8), new THREE.MeshStandardMaterial({color: 0x228b22}));
            foliage.position.set(x, 4, z);
            scene.add(foliage);

            colliders.push({minX: x-0.8, maxX: x+0.8, minZ: z-0.8, maxZ: z+0.8, width: 1.6, depth: 1.6, height: 3});
        }

        const colliders = [];
        // プレイヤーが歩いて登れる階段・高架の高さ情報
        const walkableRamps = [];
        const walkablePlatforms = [];
        const wallMat = new THREE.MeshStandardMaterial({color: 0xc4a570, roughness: 0.9});
        const damagedWallMat = new THREE.MeshStandardMaterial({color: 0xb8956f, roughness: 0.95});
        const metalMat = new THREE.MeshStandardMaterial({color: 0xaaaaaa, metalness: 0.8, roughness: 0.2});

        function addBox(x, z, w, h, d, mat, isInterior = false) {
            const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            m.position.set(x, h/2, z);
            m.userData.blocksShots = true;
            scene.add(m);

            if(!isInterior) {
                colliders.push({
                    minX: x-w/2, maxX: x+w/2,
                    minZ: z-d/2, maxZ: z+d/2,
                    width: w, depth: d, height: h
                });
            }
        }

        function createBuilding(x, z, w, d, h, floors) {
            // 建物の外壁はプレイヤーの当たり判定に含める
            addBox(x - w/2, z, 0.5, h, d, wallMat);
            addBox(x + w/2, z, 0.5, h, d, wallMat);
            addBox(x, z - d/2, w, h, 0.5, wallMat);
            addBox(x, z + d/2, w, h, 0.5, wallMat);

            const floorHeight = h / floors;
            for(let i = 0; i <= floors; i++) {
                const floorBox = new THREE.Mesh(
                    new THREE.BoxGeometry(w * 0.8, 0.1, d * 0.8),
                    new THREE.MeshStandardMaterial({color: 0xc4a570})
                );
                floorBox.position.set(x, floorHeight * i + 0.2, z);
                scene.add(floorBox);
            }
        }

        createBuilding(0, -15, 12, 8, 25, 5);
        addBox(-20, -25, 10, 15, 8, damagedWallMat);
        addBox(20, -25, 10, 15, 8, wallMat);
        addBox(0, -50, 20, 18, 10, wallMat);
        addBox(-15, -35, 6, 8, 8, metalMat);
        addBox(15, -35, 6, 8, 8, metalMat);
        addBox(-35, -20, 4, 6, 4, damagedWallMat);
        addBox(35, -20, 4, 6, 4, damagedWallMat);
        addBox(-10, -60, 8, 3, 8, metalMat);

        addTree(-40, 0);
        addTree(40, 0);
        addTree(-45, -30);
        addTree(45, -30);
        addTree(0, 30);
        addTree(-25, 25);
        addTree(25, 25);

        // 戦闘エリアに低い壁や崩れた遮蔽物を追加して、曲がりくねった通路を作る
        // プレイヤーのリスポーン地点 (0, 10) 周辺は平らで広く保つ
        const coverMat = new THREE.MeshStandardMaterial({color: 0x77766d, roughness: 1});
        const rubbleMat = new THREE.MeshStandardMaterial({color: 0x9a8065, roughness: 1});
        const coverLayout = [
            [-34,-8,12,2.4,1.2,coverMat], [-28,-13,1.2,2.8,10,coverMat],
            [-35,-20,9,1.8,1.2,rubbleMat], [-12,-7,1.2,2.2,9,coverMat],
            [13,-8,11,2.5,1.2,coverMat], [24,-14,1.2,2.7,12,rubbleMat],
            [34,-22,10,1.8,1.2,coverMat], [8,-23,1.2,2.2,9,rubbleMat],
            [-35,-38,12,2.2,1.2,coverMat], [-27,-43,1.2,2.8,9,rubbleMat],
            [-12,-31,10,1.7,1.2,rubbleMat], [2,-38,1.2,2.5,11,coverMat],
            [29,-35,12,2.1,1.2,coverMat], [35,-42,1.2,2.8,10,rubbleMat],
            [-34,-52,9,1.8,1.2,rubbleMat], [-20,-55,1.2,2.4,8,coverMat],
            [18,-53,10,2.2,1.2,coverMat], [27,-48,1.2,2.6,9,rubbleMat],
            [-8,-63,12,2.0,1.2,coverMat], [8,-66,1.2,2.4,9,rubbleMat]
        ];
        for (const [x,z,w,h,d,mat] of coverLayout) {
            addBox(x,z,w,h,d,mat);
        }

        // 低い岩状の遮蔽物。周囲を回り込めるよう間隔を空けて配置
        function addRubble(x,z,sx,sy,sz) {
            const rock = new THREE.Mesh(
                new THREE.DodecahedronGeometry(1, 0),
                rubbleMat
            );
            rock.scale.set(sx,sy,sz);
            rock.position.set(x,sy*0.72,z);
            rock.rotation.set(0.12, x*0.07, 0.08);
            scene.add(rock);
            colliders.push({minX:x-sx*0.82,maxX:x+sx*0.82,minZ:z-sz*0.82,maxZ:z+sz*0.82,width:sx*1.64,depth:sz*1.64,height:sy*1.44});
        }
        addRubble(-39,-14,2.2,1.5,1.8);
        addRubble(39,-12,2.4,1.7,2.0);
        addRubble(-17,-46,2.0,1.4,2.4);
        addRubble(15,-44,2.3,1.6,2.0);
        addRubble(-39,-61,2.5,1.8,2.1);
        addRubble(38,-60,2.2,1.5,2.3);

        // 広い3エリア：平原・丘陵・都会。スタート地点周辺は従来どおり平ら
        function addGroundZone(x,z,w,d,color,height=0.025) {
            const zone = new THREE.Mesh(
                new THREE.PlaneGeometry(w,d),
                new THREE.MeshStandardMaterial({color, roughness:1, side:THREE.DoubleSide, polygonOffset:true, polygonOffsetFactor:-1, polygonOffsetUnits:-1})
            );
            zone.rotation.x = -Math.PI/2;
            zone.position.set(x,height,z);
            scene.add(zone);
        }
        // 平原：南東側に広い平坦地と草地の色分け
        addGroundZone(92, -8, 150, 150, 0x78a94e,0.021);
        addGroundZone(92, -8, 100, 100, 0x8fba5d,0.024);

        // 丘陵：北西側に複数の丸い丘を配置。丘の裾は障害物として判定
        addGroundZone(-105, -82, 145, 170, 0x667f3c,0.022);
        const hillMat = new THREE.MeshStandardMaterial({color:0x718b45, roughness:1, flatShading:true});
        const hillTopMat = new THREE.MeshStandardMaterial({color:0x879b52, roughness:1, flatShading:true});
        function addHill(x,z,rx,rz,height,mat=hillMat) {
            const hill = new THREE.Mesh(new THREE.SphereGeometry(1,20,12,0,Math.PI*2,0,Math.PI/2),mat);
            hill.scale.set(rx,height,rz);
            hill.position.set(x,0,z);
            scene.add(hill);
            colliders.push({minX:x-rx*0.78,maxX:x+rx*0.78,minZ:z-rz*0.78,maxZ:z+rz*0.78,width:rx*1.56,depth:rz*1.56,height});
        }
        addHill(-105,-48,19,22,13);
        addHill(-68,-72,22,25,17,hillTopMat);
        addHill(-112,-105,24,21,15);
        addHill(-62,-119,18,22,12,hillTopMat);
        addHill(-18,-112,15,18,9);
        addHill(-145,-55,18,25,12,hillTopMat);
        addHill(-115,-145,22,18,11);
        addHill(-55,-155,20,17,10,hillTopMat);

        // 都会：箱形の簡易絵ではなく、窓・屋上設備付きの3Dビルを生成
        addGroundZone(98,-92,150,140,0x555b60,0.03);
        const cityRoadMat = new THREE.MeshStandardMaterial({color:0x30363b, roughness:0.95});
        const roadLineMat = new THREE.MeshStandardMaterial({color:0xd9d2a0, roughness:0.9});
        const glassMats = [
            new THREE.MeshStandardMaterial({color:0x5e9db5, metalness:0.35, roughness:0.25, emissive:0x10232b}),
            new THREE.MeshStandardMaterial({color:0x9bb9c4, metalness:0.25, roughness:0.3}),
            new THREE.MeshStandardMaterial({color:0x344e63, metalness:0.45, roughness:0.22})
        ];
        const buildingMats = [
            new THREE.MeshStandardMaterial({color:0x858d96, roughness:0.8}),
            new THREE.MeshStandardMaterial({color:0xb3a99a, roughness:0.85}),
            new THREE.MeshStandardMaterial({color:0x626d78, roughness:0.75}),
            new THREE.MeshStandardMaterial({color:0x9caaa9, roughness:0.7})
        ];
        function createCityBuilding(x,z,w,d,h,index) {
            const mat = buildingMats[index % buildingMats.length];
            // 建物を中空にし、正面中央に入口を設ける
            const wall = 0.65;
            const doorW = Math.min(4.2, w * 0.34);
            const doorH = 3.4;
            function buildingWall(px,py,pz,bw,bh,bd) {
                const part = new THREE.Mesh(new THREE.BoxGeometry(bw,bh,bd),mat);
                part.position.set(px,py,pz);
                part.castShadow = true;
                part.receiveShadow = true;
                scene.add(part);
                colliders.push({minX:px-bw/2,maxX:px+bw/2,minZ:pz-bd/2,maxZ:pz+bd/2,width:bw,depth:bd,height:bh});
            }
            buildingWall(x-w/2+wall/2,h/2,z,wall,h,d);
            buildingWall(x+w/2-wall/2,h/2,z,wall,h,d);
            buildingWall(x,h/2,z+d/2-wall/2,w,h,wall);
            const sideW = (w-doorW)/2;
            buildingWall(x-w/2+sideW/2,h/2,z-d/2+wall/2,sideW,h,wall);
            buildingWall(x+w/2-sideW/2,h/2,z-d/2+wall/2,sideW,h,wall);
            // 入口上部の梁は見た目だけにし、プレイヤーの通行を妨げない
            const lintelWall = new THREE.Mesh(new THREE.BoxGeometry(doorW,h-doorH,wall),mat);
            lintelWall.position.set(x,doorH+(h-doorH)/2,z-d/2+wall/2);
            lintelWall.castShadow = true;
            lintelWall.receiveShadow = true;
            scene.add(lintelWall);
            const insideFloor = new THREE.Mesh(
                new THREE.PlaneGeometry(w-wall*2,d-wall*2),
                new THREE.MeshStandardMaterial({color:0x77736b,roughness:0.95,side:THREE.DoubleSide})
            );
            insideFloor.rotation.x=-Math.PI/2;
            insideFloor.position.set(x,0.035,z);
            scene.add(insideFloor);

            // 2階以上の室内フロアと階段を追加（建物ごとに階数を変える）
            const floorLevels = [];
            const levelCount = Math.max(2, Math.min(5, Math.floor(h / 7)));
            const upperFloorMat = new THREE.MeshStandardMaterial({color:0x918b80,roughness:0.92,side:THREE.DoubleSide});
            const stairMat = new THREE.MeshStandardMaterial({color:0x68645e,roughness:0.9});
            for(let level=1; level<levelCount; level++) {
                const levelY = Math.min(h-3, level*4.2);
                floorLevels.push(levelY);
                const upperFloor = new THREE.Mesh(
                    new THREE.BoxGeometry(w-wall*2,0.22,d-wall*2),
                    upperFloorMat
                );
                upperFloor.position.set(x,levelY,z);
                upperFloor.receiveShadow = true;
                scene.add(upperFloor);
                walkablePlatforms.push({minX:x-w/2+wall,maxX:x+w/2-wall,minZ:z-d/2+wall,maxZ:z+d/2-wall,height:levelY+0.12});

                // 各階をつなぐ階段（見た目用）
                const stairWidth = Math.min(2.4,w*0.28);
                const stairLength = Math.min(5.2,d*0.55);
                const steps = 8;
                // 階段の下に歩行可能な傾斜面を設け、連続して上れるようにする
                const rampMesh = new THREE.Mesh(
                    new THREE.BoxGeometry(stairWidth,0.16,stairLength),
                    stairMat
                );
                rampMesh.position.set(x-w*0.22,levelY/2,z);
                rampMesh.rotation.x = -Math.atan2(levelY,stairLength);
                scene.add(rampMesh);
                walkableRamps.push({
                    minX:x-w*0.22-stairWidth/2,maxX:x-w*0.22+stairWidth/2,
                    minZ:z-stairLength/2,maxZ:z+stairLength/2,
                    lowY:levelY-4.2,highY:levelY
                });
                for(let step=0; step<steps; step++) {
                    const tread = new THREE.Mesh(
                        new THREE.BoxGeometry(stairWidth,0.18,stairLength/steps),
                        stairMat
                    );
                    tread.position.set(
                        x-w*0.22,
                        (levelY-4.2)+((step+0.5)/steps)*4.2,
                        z-d*0.22+(step+0.5)*(stairLength/steps)
                    );
                    scene.add(tread);
                }
            }
            const doorFrameMat = new THREE.MeshStandardMaterial({color:0x343b42,metalness:0.45,roughness:0.55});
            for(const side of [-1,1]) {
                const frame = new THREE.Mesh(new THREE.BoxGeometry(0.18,doorH,0.2),doorFrameMat);
                frame.position.set(x+side*doorW/2,doorH/2,z-d/2);
                scene.add(frame);
            }
            const lintel = new THREE.Mesh(new THREE.BoxGeometry(doorW+0.18,0.18,0.2),doorFrameMat);
            lintel.position.set(x,doorH,z-d/2);
            scene.add(lintel);
            const windowMat = glassMats[index % glassMats.length];
            const rows = Math.max(3,Math.floor(h/3.2));
            const colsFront = Math.max(2,Math.floor(w/2.4));
            for(let row=1;row<rows;row++) {
                const wy = row*(h/rows);
                for(let col=0;col<colsFront;col++) {
                    const wx = -w/2 + (col+0.5)*w/colsFront;
                    for(const side of [-1,1]) {
                        const win = new THREE.Mesh(new THREE.BoxGeometry(w/colsFront*0.52,1.05,0.07),windowMat);
                        win.position.set(x+wx,wy,z+side*(d/2+0.045));
                        scene.add(win);
                    }
                }
            }
            const colsSide = Math.max(2,Math.floor(d/2.4));
            for(let row=1;row<rows;row++) {
                const wy = row*(h/rows);
                for(let col=0;col<colsSide;col++) {
                    const wz = -d/2 + (col+0.5)*d/colsSide;
                    for(const side of [-1,1]) {
                        const win = new THREE.Mesh(new THREE.BoxGeometry(0.07,1.05,d/colsSide*0.52),windowMat);
                        win.position.set(x+side*(w/2+0.045),wy,z+wz);
                        scene.add(win);
                    }

            }
            const roof = new THREE.Mesh(new THREE.BoxGeometry(w*0.72,0.8,d*0.72),new THREE.MeshStandardMaterial({color:0x454d55,roughness:0.9}));
            roof.position.set(x,h+0.4,z);
            scene.add(roof);
            // 屋上の小さな設備
            const unit = new THREE.Mesh(new THREE.BoxGeometry(w*0.18,1.6,d*0.18),metalMat);
            unit.position.set(x-w*0.22,h+1.6,z);
            scene.add(unit);
        }
        // 交差点と道路を残し、ビルの間を走り抜けられる配置
        const roadX = new THREE.Mesh(new THREE.PlaneGeometry(12,140),cityRoadMat);
        roadX.rotation.x=-Math.PI/2; roadX.position.set(98,0.04,-92); scene.add(roadX);
        const roadZ = new THREE.Mesh(new THREE.PlaneGeometry(150,12),cityRoadMat);

        const roadMark = new THREE.Mesh(new THREE.PlaneGeometry(0.35,130),roadLineMat);
        roadMark.rotation.x=-Math.PI/2; roadMark.position.set(98,0.06,-92); scene.add(roadMark);

        // 立体交差：中央交差点の上を通る高架歩道・道路

        walkableRamps.push({minX:94,maxX:102,minZ:-77,maxZ:-58,lowY:6.2,highY:0,axis:"z",direction:-1});
        const overpassDeck = new THREE.Mesh(new THREE.BoxGeometry(9,0.7,30),overpassMat);

        for(const z of [-103,-92,-81]) {

        const cityBuildings = [

        // 都会の外周にも高さや形の違うビルを追加して街区を広げる
        const outerCityBuildings = [

        outerCityBuildings.forEach((b,i)=>createCityBuilding(...b,i+cityBuildings.length));
        // 街路灯を道路沿いに配置
        const lampMat = new THREE.MeshStandardMaterial({color:0x30343a, metalness:0.65, roughness:0.4});

        function addStreetLamp(x,z) {

        function createDummy(x, z) {
            const dummyGroup = new THREE.Group();
            dummyGroup.position.set(x, 0, z);

            scene.add(dummyGroup);
            return {

                leftArm: leftArm,

                moveDir: Math.random() * Math.PI * 2,

        const DUMMY_BOUNDS = { minX: -175, maxX: 175, minZ: -180, maxZ: 60 };
        function findOpenPosition(margin = 2, maxAttempts = 100) {
            for (let attempt = 0; attempt < maxAttempts; attempt++) {
                const x = DUMMY_BOUNDS.minX + Math.random() * (DUMMY_BOUNDS.maxX - DUMMY_BOUNDS.minX);
                const z = DUMMY_BOUNDS.minZ + Math.random() * (DUMMY_BOUNDS.maxZ - DUMMY_BOUNDS.minZ);
                const blocked = colliders.some(c =>
                    x > c.minX - margin && x < c.maxX + margin &&
                    z > c.minZ - margin && z < c.maxZ + margin
                );
                if (!blocked) return { x, z };
            }
            // 配置が密な場合でも無限ループでゲーム起動を止めない
            return { x: 0, z: 0 };
        }

        const dummies = [];
        for (let i = 0; i < 3; i++) {
            const pos = findOpenPosition(3);
            dummies.push(createDummy(pos.x, pos.z));
        }

        const targets = [];
        const tGeo = new THREE.IcosahedronGeometry(0.8, 0);
        const tMat = new THREE.MeshStandardMaterial({color: 0xff3300, emissive: 0xff0000, emissiveIntensity: 0.6});
        for (let i = 0; i < 8; i++) {
            const t = new THREE.Mesh(tGeo, tMat);
            // 初期配置でも建物や障害物の内部を避ける
            const pos = findOpenPosition(1);
            t.position.set(pos.x, 2 + Math.random() * 4, pos.z);
            scene.add(t);
            targets.push(t);
        }

        const weapons = {
            pistol: { maxAmmo: 15, reloadTime: 0.85, damage: 1, fireRate: 0.12, spreadAngle: 0.02, isAutomatic: true },
            rifle: { maxAmmo: 30, reloadTime: 1.2, damage: 2, fireRate: 0.08, spreadAngle: 0.01, isAutomatic: true },
            sniper: { maxAmmo: 5, reloadTime: 1.8, damage: 5, fireRate: 0.9, spreadAngle: 0.002, isAutomatic: false },
            shotgun: { maxAmmo: 8, reloadTime: 1.5, damage: 3, fireRate: 0.6, spreadAngle: 0.1, isAutomatic: false }
        };

        let currentWeapon = 'pistol';
        let ammo = weapons[currentWeapon].maxAmmo;
        let isAiming = false;
        const adsButton = document.getElementById('ads-button');
        const scopeOverlay = document.getElementById('scope-overlay');
        function setAiming(value) {
            isAiming = Boolean(value);
            adsButton.classList.toggle('enabled', isAiming);
            adsButton.textContent = isAiming ? 'AIM: ON' : 'AIM: OFF';
            adsButton.setAttribute('aria-pressed', String(isAiming));
            const sniperScopeActive = isAiming && currentWeapon === 'sniper';
            scopeOverlay.style.display = sniperScopeActive ? 'block' : 'none';
            if (typeof gunGroup !== 'undefined') gunGroup.visible = !sniperScopeActive;
            document.getElementById('crosshair').style.opacity = isAiming ? '0' : '1';
        }
        adsButton.addEventListener('pointerdown', e => { e.preventDefault(); setAiming(!isAiming); });
        document.addEventListener('pointerdown', e => { if (e.button === 2 && !isMobile) setAiming(true); });
        document.addEventListener('pointerup', e => { if (e.button === 2 && !isMobile) setAiming(false); });
        document.addEventListener('pointercancel', () => { if (!isMobile) setAiming(false); });
        let isReloading = false;
        let reloadTimer = 0;
        let isFiring = false;

        const gunGroup = new THREE.Group();
        let currentGunModel;

        function createGunModel(type) {
            if (currentGunModel) {
                currentGunModel.traverse(object => {
                    if (!object.isMesh) return;
                    object.geometry?.dispose();
                    if (Array.isArray(object.material)) object.material.forEach(material => material.dispose());
                    else object.material?.dispose();
                });
                gunGroup.remove(currentGunModel);
                currentGunModel = null;
            }

            const model = new THREE.Group();
            const metal = new THREE.MeshStandardMaterial({ color: 0x263342, metalness: 0.78, roughness: 0.3 });
            const dark = new THREE.MeshStandardMaterial({ color: 0x151c25, metalness: 0.65, roughness: 0.38 });

            const addBox = (w,h,d,x,y,z,mat=metal) => {
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
                mesh.position.set(x,y,z); model.add(mesh); return mesh;
            };
            const addBarrel = (radius,length,x,y,z,mat=dark) => {

        // iPadでも開始時に地面と建物が確実に視界へ入るよう、初期視点を下向きにする
        let yaw = 0, pitch = -0.35, velocityY = 0, isGrounded = true;

        const MOVE_SPEED = 0.15;
        const PLAYER_RADIUS = 0.5;

        const reloadUI = document.getElementById('reload-container');

        const minimapCanvas = document.getElementById('minimap');
        const minimapCtx = minimapCanvas.getContext('2d');
        minimapCanvas.width = 150;
        minimapCanvas.height = 150;
        // アリーナ全体がミニマップに収まる縮尺（横幅・奥行きの大きい方に合わせる）
        const MINIMAP_SCALE = 150 / Math.max(
            DUMMY_BOUNDS.maxX - DUMMY_BOUNDS.minX,
            DUMMY_BOUNDS.maxZ - DUMMY_BOUNDS.minZ
        );
        const MINIMAP_OFFSET_Y = (150 - (DUMMY_BOUNDS.maxZ - DUMMY_BOUNDS.minZ) * MINIMAP_SCALE) / 2;
        const mapX = x => (x - DUMMY_BOUNDS.minX) * MINIMAP_SCALE;
        const mapY = z => (DUMMY_BOUNDS.maxZ - z) * MINIMAP_SCALE + MINIMAP_OFFSET_Y;

        function updateMinimap() {
            minimapCtx.fillStyle = '#2a2a2a';
            minimapCtx.fillRect(0, 0, minimapCanvas.width, minimapCanvas.height);

            minimapCtx.strokeStyle = '#444444';
            minimapCtx.lineWidth = 0.5;
            for(let i = 0; i <= 10; i++) {
                minimapCtx.beginPath();
                minimapCtx.moveTo(i * 15, 0);
                minimapCtx.lineTo(i * 15, minimapCanvas.height);
                minimapCtx.stroke();
            }

            minimapCtx.fillStyle = '#8b7d72';
            for(const c of colliders) {
                const px = mapX(c.minX);
                const py = mapY(c.maxZ);
                const pw = (c.maxX - c.minX) * MINIMAP_SCALE;
                const ph = (c.maxZ - c.minZ) * MINIMAP_SCALE;
                minimapCtx.fillRect(px, py, pw, ph);
            }

            minimapCtx.fillStyle = '#ff9999';
            for(const dummy of dummies) {
                if(!dummy.isAlive) continue;
                const px = mapX(dummy.group.position.x);
                const py = mapY(dummy.group.position.z);
                minimapCtx.beginPath();
                minimapCtx.arc(px, py, 3, 0, Math.PI * 2);
                minimapCtx.fill();
            }

            minimapCtx.fillStyle = '#00ff00';
            const playerPx = mapX(playerPos.x);
            const playerPy = mapY(playerPos.z);
            minimapCtx.beginPath();
            minimapCtx.arc(playerPx, playerPy, 4, 0, Math.PI * 2);
            minimapCtx.fill();

            minimapCtx.strokeStyle = '#00ff00';
            minimapCtx.lineWidth = 2;
            minimapCtx.beginPath();
            minimapCtx.moveTo(playerPx, playerPy);
            const dirX = Math.sin(yaw) * 8;
            const dirZ = Math.cos(yaw) * 8;
            minimapCtx.lineTo(playerPx + dirX, playerPy - dirZ);
            minimapCtx.stroke();
        }

        const keys = {};
        function clearInputState() {
            for (const key of Object.keys(keys)) keys[key] = false;
            moveF = 0;
            moveR = 0;
            isFiring = false;
            joyPointerId = null;
            lookState.pointerId = null;

        }
        window.addEventListener('blur', clearInputState);
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) clearInputState();

        window.addEventListener('keydown', e => {

                e.preventDefault();

            }
            if (e.key.toLowerCase() === 'r') {

        renderer.domElement.addEventListener('click', () => {

        document.addEventListener('mousemove', e => {

                yaw -= e.movementX * 0.005;
                pitch -= e.movementY * 0.005;
                pitch = Math.max(-1.45, Math.min(1.45, pitch));
            }
        });

        renderer.domElement.addEventListener('mousedown', () => {
            if (isMobile) return;
            if (weapons[currentWeapon].isAutomatic) {
                isFiring = true;
            } else {
                isFiring = false;
                shoot();
            }
        });
        window.addEventListener('mouseup', () => { isFiring = false; });

        // Pointer Events でタッチ・マウスを統一し、iPad Edge/Safari の入力差を減らす
        const lookState = { pointerId: null, x: 0, y: 0 };
        window.addEventListener('pointerdown', e => {
            if (e.pointerType === 'mouse' || e.target.closest('#joystick-container')) return;
            // FIREボタンを押したまま、その指を動かしても視点を動かせるようにする
            // JUMP / RELOAD / SWAP などのボタン操作は視点移動として扱わない
            const isFireButton = e.target.closest('#fire-button');
            if (e.target.closest('.btn') && !isFireButton) return;
            const triggerPoint = isTablet ? window.innerWidth * 0.4 : window.innerWidth / 2;
            if ((e.clientX > triggerPoint || isFireButton) && lookState.pointerId === null) {
                lookState.pointerId = e.pointerId;
                lookState.x = e.clientX;
                lookState.y = e.clientY;
            }
        }, { passive: true });

        window.addEventListener('pointermove', e => {
            if (e.pointerId !== lookState.pointerId) return;
            yaw -= (e.clientX - lookState.x) * 0.0055;
            pitch -= (e.clientY - lookState.y) * 0.0055;
            pitch = Math.max(-1.45, Math.min(1.45, pitch));
            lookState.x = e.clientX;
            lookState.y = e.clientY;
        });

        const releaseLook = e => {
            if (e.pointerId === lookState.pointerId) lookState.pointerId = null;
        };
        window.addEventListener('pointerup', releaseLook);
        window.addEventListener('pointercancel', releaseLook);

        const joy = document.getElementById('joystick-container');
        const knob = document.getElementById('joystick-knob');
        let joyPointerId = null;

        function updateJoystick(clientX, clientY) {
            const r = joy.getBoundingClientRect();
            const dx = clientX - (r.left + r.width / 2);
            const dy = clientY - (r.top + r.height / 2);
            const dist = Math.hypot(dx, dy);
            const d = Math.min(dist, 50);
            const a = dist > 0 ? Math.atan2(dy, dx) : 0;
            knob.style.transform = `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d}px)`;
            moveR = (d / 50) * Math.cos(a);
            moveF = -(d / 50) * Math.sin(a);
        }

        joy.addEventListener('pointerdown', e => {
            e.preventDefault();
            if (joyPointerId !== null) return;
            joyPointerId = e.pointerId;
            joy.setPointerCapture(e.pointerId);
            updateJoystick(e.clientX, e.clientY);
        });
        joy.addEventListener('pointermove', e => {
            if (e.pointerId !== joyPointerId) return;
            e.preventDefault();
            updateJoystick(e.clientX, e.clientY);
        });
        const releaseJoystick = e => {
            if (e.pointerId !== joyPointerId) return;
            moveF = 0;
            moveR = 0;
            knob.style.transform = 'translate(0,0)';
            joyPointerId = null;
        };
        joy.addEventListener('pointerup', releaseJoystick);
        joy.addEventListener('pointercancel', releaseJoystick);
        joy.addEventListener('lostpointercapture', releaseJoystick);

        const ray = new THREE.Raycaster();
        const aimRay = new THREE.Raycaster();
        let autoAimEnabled = false;
        const aimToggle = document.getElementById('aim-toggle');
        function toggleAutoAim(e) {
            e.preventDefault();
            e.stopPropagation();
            autoAimEnabled = !autoAimEnabled;
            aimToggle.textContent = autoAimEnabled ? 'AUTO AIM: ON' : 'AUTO AIM: OFF';
            aimToggle.classList.toggle('enabled', autoAimEnabled);
            aimToggle.setAttribute('aria-pressed', String(autoAimEnabled));
        }
        // タッチ端末でも確実に反応するよう Pointer Events で切り替える
        aimToggle.addEventListener('pointerdown', toggleAutoAim);

        // ONの間は狙いを少しずつ補正する。ロック対象を維持して視点の揺れを防ぐ
        let lockedAimDummy = null;
        function updateAutoAim(delta) {
            if (!autoAimEnabled) {
                lockedAimDummy = null;
                return;
            }

            const origin = playerPos.clone();
            const viewQuaternion = new THREE.Quaternion().setFromEuler(
                new THREE.Euler(pitch, yaw, 0, 'YXZ')
            );
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(viewQuaternion).normalize();
            const blockers = scene.children.filter(object => object.userData.blocksShots);

            const isVisibleTarget = dummy => {
                if (!dummy || !dummy.isAlive) return null;
                const center = new THREE.Vector3(
                    dummy.group.position.x,
                    dummy.group.position.y + 1.0,
                    dummy.group.position.z
                );
                const toTarget = center.clone().sub(origin);
                const distance = toTarget.length();
                if (distance < 0.1) return null;
                const direction = toTarget.clone().normalize();
                if (forward.dot(direction) < 0.35) return null;

                aimRay.set(origin, direction);
                aimRay.far = distance;
                const obstruction = aimRay.intersectObjects(blockers, false)[0];
                if (obstruction && obstruction.distance < distance - 0.15) return null;

                const projected = center.clone().project(camera);
                if (projected.z < -1 || projected.z > 1) return null;
                return { center, distance, screenDistance: Math.hypot(projected.x, projected.y) };
            };

            // 現在の対象を優先し、対象が視界から外れたときだけ別の敵を選ぶ
            let target = isVisibleTarget(lockedAimDummy);
            if (!target || target.screenDistance > 0.5) {
                lockedAimDummy = null;
                let bestScore = Infinity;
                for (const dummy of dummies) {
                    const candidate = isVisibleTarget(dummy);
                    if (!candidate || candidate.screenDistance > 0.3) continue;
                    const score = candidate.screenDistance + candidate.distance * 0.0005;
                    if (score < bestScore) {
                        bestScore = score;
                        lockedAimDummy = dummy;
                        target = candidate;
                    }
                }
            }
            if (!target) return;

            const direction = target.center.clone().sub(origin).normalize();
            const targetYaw = Math.atan2(-direction.x, -direction.z);
            const targetPitch = Math.asin(Math.max(-1, Math.min(1, direction.y)));
            const angleDelta = angle => Math.atan2(Math.sin(angle), Math.cos(angle));

            // 補正を弱め、手動エイムを邪魔しない滑らかな追尾にする
            const trackingStrength = 1 - Math.exp(-Math.max(0, delta) * 2.2);
            yaw += angleDelta(targetYaw - yaw) * trackingStrength;
            pitch += (targetPitch - pitch) * trackingStrength;
            pitch = Math.max(-1.45, Math.min(1.45, pitch));
        }

        let lastShotTime = 0;

        function showDamageIndicator(damage, screenX, screenY) {
            const damageEl = document.createElement('div');
            damageEl.className = 'damage-number';
            damageEl.innerText = damage;
            damageEl.style.left = screenX + 'px';
            damageEl.style.top = screenY + 'px';
            damageIndicatorsContainer.appendChild(damageEl);

            let opacity = 1;
            let offsetY = 0;
            const startTime = Date.now();

            function animate() {
                const elapsed = (Date.now() - startTime) / 1000;
                if (elapsed > 1.2) {
                    damageEl.remove();
                    return;
                }

                offsetY = elapsed * 40;
                opacity = Math.max(0, 1 - (elapsed / 1.2));
                damageEl.style.opacity = opacity;
                damageEl.style.transform = `translateY(-${offsetY}px)`;

                requestAnimationFrame(animate);
            }
            animate();
        }

        function shoot() {
            const weapon = weapons[currentWeapon];
            if (ammo <= 0 || isReloading) return;
            const now = Date.now() / 1000;
            if (now - lastShotTime < weapon.fireRate) return;

            lastShotTime = now;
            ammo--;
            document.getElementById('ammo-display').innerText = `${ammo} / ${weapon.maxAmmo}`;
            gunGroup.position.z += 0.22;

            ray.setFromCamera(new THREE.Vector2(0, 0), camera);

            // 壁・ターゲット・生存中の敵を同じレイで調べ、最も近い交差だけを処理する
            const blockers = scene.children.filter(object => object.userData.blocksShots);
            const targetMeshes = targets.filter(target => target.scale.x !== 0);
            const dummyMeshes = [];
            for (const dummy of dummies) {
                if (!dummy.isAlive) continue;
                for (const mesh of [dummy.body, dummy.head, dummy.leftArm, dummy.rightArm, dummy.leftLeg, dummy.rightLeg]) {
                    dummyMeshes.push(mesh);
                }
            }

            // 念のため未定義・非Meshを除外し、無効な候補で射撃処理が停止しないようにする
            const candidates = [...blockers, ...targetMeshes, ...dummyMeshes]
                .filter(object => object && object.isObject3D && typeof object.raycast === 'function');
            // 敵の各部位は直接Meshを渡して判定する
            const hits = ray.intersectObjects(candidates, false);
            if (hits.length === 0) return;

            const hit = hits[0];
            // 最初に当たったのが壁・箱なら、後ろの敵やターゲットには命中させない
            if (hit.object.userData.blocksShots) return;

            if (targets.includes(hit.object)) {
                const target = hit.object;
                target.scale.set(0, 0, 0);
                showDamageIndicator(weapon.damage, window.innerWidth / 2, window.innerHeight / 2 - 50);
                setTimeout(() => {
                    target.scale.set(1, 1, 1);
                    const pos = findOpenPosition(2);
                    target.position.set(pos.x, 2 + Math.random() * 4, pos.z);
                }, 2000);
                return;
            }

            const dummy = dummies.find(item =>
                item.isAlive &&
                [item.body, item.head, item.leftArm, item.rightArm, item.leftLeg, item.rightLeg].includes(hit.object)
            );
            if (!dummy) return;

            dummy.health -= weapon.damage;
            dummy.hitFlashTimer = dummy.hitFlashDuration;
            showDamageIndicator(weapon.damage, window.innerWidth / 2, window.innerHeight / 2 - 50);

            if (dummy.health <= 0) {
                dummy.isAlive = false;
                dummy.group.scale.set(0, 0, 0);
            }
        }

        function swapWeapon() {
            const weaponList = ['pistol', 'rifle', 'sniper', 'shotgun'];
            const currentIndex = weaponList.indexOf(currentWeapon);
            currentWeapon = weaponList[(currentIndex + 1) % weaponList.length];
            ammo = weapons[currentWeapon].maxAmmo;
            isReloading = false;
            isFiring = false;
            reloadUI.style.display = 'none';
            gunGroup.position.y = 0;
            gunGroup.position.z = 0;

            document.getElementById('weapon-display').innerText = currentWeapon.toUpperCase();
            document.getElementById('ammo-display').innerText = `${ammo} / ${weapons[currentWeapon].maxAmmo}`;
            createGunModel(currentWeapon);
            setAiming(false);
        }

        function startReload() {
            const weapon = weapons[currentWeapon];
            if (!isReloading && ammo < weapon.maxAmmo) {
                isReloading = true;
                isFiring = false;
                reloadTimer = 0;
                reloadUI.style.display = 'block';
            }
        }

        const fireButton = document.getElementById('fire-button');
        function beginFiring(e) {
            e.preventDefault();
            if (weapons[currentWeapon].isAutomatic) {
                isFiring = true;
            } else {
                isFiring = false;
                shoot();
            }
            if (e.pointerId !== undefined && fireButton.setPointerCapture) {
                try { fireButton.setPointerCapture(e.pointerId); } catch (_) {}
            }
        }
        fireButton.addEventListener('pointerdown', beginFiring);
        const stopFiring = () => { isFiring = false; };
        fireButton.addEventListener('pointerup', stopFiring);
        fireButton.addEventListener('pointercancel', stopFiring);
        fireButton.addEventListener('lostpointercapture', stopFiring);

        document.getElementById('jump-button').addEventListener('pointerdown', e => {
            e.preventDefault();
            tryJump();
        });
        document.getElementById('weapon-swap-button').addEventListener('pointerdown', e => {
            e.preventDefault();
            swapWeapon();
        });
        document.getElementById('reload-button').addEventListener('pointerdown', e => {
            e.preventDefault();
            startReload();
        });

        function checkCollision(x, z, radius, feetY = 0) {
            for (const c of colliders) {
                // 今いる階より低い壁・支柱は衝突対象にしない
                if (c.height !== undefined && c.height < feetY - 0.25) continue;
                const closestX = Math.max(c.minX, Math.min(x, c.maxX));
                const closestZ = Math.max(c.minZ, Math.min(z, c.maxZ));
                const distX = x - closestX;
                const distZ = z - closestZ;
                const distSq = distX * distX + distZ * distZ;

                if (distSq < radius * radius) {
                    return true;
                }
            }
            return false;
        }

        function updateDummies(delta) {
            for (const dummy of dummies) {
                if (!dummy.isAlive) continue;

                dummy.wanderTimer += delta;
                if (dummy.wanderTimer > dummy.wanderInterval) {
                    dummy.moveDir = Math.random() * Math.PI * 2;
                    dummy.wanderInterval = 2 + Math.random() * 4;
                    dummy.wanderTimer = 0;
                }

                const moveSpeed = 0.08;
                let newX = dummy.group.position.x + Math.cos(dummy.moveDir) * moveSpeed * delta * 60;
                let newZ = dummy.group.position.z + Math.sin(dummy.moveDir) * moveSpeed * delta * 60;

                newX = Math.max(DUMMY_BOUNDS.minX, Math.min(newX, DUMMY_BOUNDS.maxX));
                newZ = Math.max(DUMMY_BOUNDS.minZ, Math.min(newZ, DUMMY_BOUNDS.maxZ));

                if (!checkCollision(newX, newZ, 0.35)) {
                    dummy.group.position.x = newX;
                    dummy.group.position.z = newZ;
                    dummy.group.rotation.y = dummy.moveDir;
                } else {
                    dummy.moveDir = Math.random() * Math.PI * 2;
                }

                const walkCycle = (Date.now() * 0.01) % (Math.PI * 2);
                dummy.leftArm.rotation.z = Math.sin(walkCycle) * 0.3;
                dummy.rightArm.rotation.z = Math.sin(walkCycle + Math.PI) * 0.3;
                dummy.leftLeg.rotation.x = Math.sin(walkCycle) * 0.2;
                dummy.rightLeg.rotation.x = Math.sin(walkCycle + Math.PI) * 0.2;

                // ダメージフラッシュ更新
                if (dummy.hitFlashTimer > 0) {
                    dummy.hitFlashTimer -= delta;
                    const flashIntensity = dummy.hitFlashTimer / dummy.hitFlashDuration;
                    dummy.body.material.color.setHex(0xFF4444);
                    dummy.body.material.emissive.setHex(0xFF0000);
                    dummy.body.material.emissiveIntensity = flashIntensity * 0.8;
                } else {
                    dummy.body.material.color.setHex(dummy.originalBodyColor);
                    dummy.body.material.emissive.setHex(0x000000);
                    dummy.body.material.emissiveIntensity = 0;
                }

                // ヘルスバーは一度だけ作り、体力が変わったときだけテクスチャを更新する
                if (!dummy.healthBarCanvas) {
                    dummy.healthBarCanvas = document.createElement('canvas');
                    dummy.healthBarCanvas.width = 64;
                    dummy.healthBarCanvas.height = 8;
                    dummy.healthBarTexture = new THREE.CanvasTexture(dummy.healthBarCanvas);
                    dummy.healthBarMaterial = new THREE.MeshBasicMaterial({
                        map: dummy.healthBarTexture,
                        transparent: true,
                        depthWrite: false,
                        side: THREE.DoubleSide
                    });
                    dummy.healthBar = new THREE.Mesh(
                        new THREE.PlaneGeometry(0.8, 0.1),
                        dummy.healthBarMaterial
                    );
                    dummy.healthBar.position.y = 2.5;
                    dummy.healthBar.userData.isHealthBar = true;
                    dummy.group.add(dummy.healthBar);
                    dummy.renderedHealth = -1;
                }

                if (dummy.renderedHealth !== dummy.health) {
                    const healthPercent = Math.max(0, Math.min(1, dummy.health / dummy.maxHealth));
                    const ctx = dummy.healthBarCanvas.getContext('2d');
                    ctx.clearRect(0, 0, 64, 8);
                    ctx.fillStyle = '#222222';
                    ctx.fillRect(0, 0, 64, 8);
                    ctx.fillStyle = healthPercent > 0.5 ? '#00ff00' : healthPercent > 0.25 ? '#ffff00' : '#ff0000';
                    ctx.fillRect(0, 0, 64 * healthPercent, 8);
                    dummy.healthBarTexture.needsUpdate = true;
                    dummy.renderedHealth = dummy.health;
                }
                // 敵の向きに関係なく、体力バーをプレイヤー側へ向ける
                dummy.healthBar.quaternion.copy(camera.quaternion);
            }
        }

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            // タブ復帰時の巨大なdeltaで移動や物理が暴れないよう、フレーム時間を制限
            const delta = Math.min(clock.getDelta(), 0.05);
            const frameScale = delta * 60;
            updateAutoAim(delta);
            camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));

            if (!isMobile) {
                moveF = 0;
                moveR = 0;
                if (keys['w']) moveF += 1;
                if (keys['s']) moveF -= 1;
                if (keys['a']) moveR -= 1;
                if (keys['d']) moveR += 1;
            }

            const fw = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            fw.y = 0;
            fw.normalize();
            const rt = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), fw).negate();

            const moveVec = new THREE.Vector3(
                fw.x * moveF + rt.x * moveR,
                0,
                fw.z * moveF + rt.z * moveR
            );
            // 斜め移動でも前後左右と同じ速度にする
            if (moveVec.lengthSq() > 1) moveVec.normalize();
            moveVec.multiplyScalar(MOVE_SPEED * frameScale);

            const nX = playerPos.x + moveVec.x;
            const nZ = playerPos.z + moveVec.z;

            const feetY = Math.max(0,playerPos.y-1.6);
            if (!checkCollision(nX, playerPos.z, PLAYER_RADIUS, feetY)) {
                playerPos.x = nX;
            }
            if (!checkCollision(playerPos.x, nZ, PLAYER_RADIUS, feetY)) {
                playerPos.z = nZ;
            }

            // 階段・高架スロープ・各階の床に合わせて足元の高さを更新
            let supportY = 0;
            for(const ramp of walkableRamps) {
                if(playerPos.x >= ramp.minX && playerPos.x <= ramp.maxX && playerPos.z >= ramp.minZ && playerPos.z <= ramp.maxZ) {
                    let t = (playerPos.z-ramp.minZ)/(ramp.maxZ-ramp.minZ);
                    if(ramp.direction === -1) t = 1-t;
                    supportY = Math.max(supportY,ramp.lowY+(ramp.highY-ramp.lowY)*Math.max(0,Math.min(1,t)));
                }
            }
            for(const platform of walkablePlatforms) {
                if(playerPos.x >= platform.minX && playerPos.x <= platform.maxX && playerPos.z >= platform.minZ && playerPos.z <= platform.maxZ && feetY >= platform.height-1.25) {
                    supportY = Math.max(supportY,platform.height);
                }
            }
            currentSupportY = supportY;
            const targetPlayerY = supportY + 1.6;
            // 接地中は坂や階段の高さに追従。ジャンプ中は上昇を妨げず、
            // 落下して足場の高さまで戻ったときだけ着地させる。
            if (isGrounded) {
                playerPos.y = targetPlayerY;
                velocityY = 0;
            } else {
                velocityY -= 0.019 * frameScale;
                playerPos.y += velocityY * frameScale;
                if (velocityY <= 0 && playerPos.y <= targetPlayerY + 0.12) {
                    playerPos.y = targetPlayerY;
                    velocityY = 0;
                    isGrounded = true;
                } else if (playerPos.y <= 1.6) {
                    playerPos.y = 1.6;
                    velocityY = 0;
                    isGrounded = true;
                }
            }

            if (isFiring && !isReloading) {
                shoot();
            }

            const weapon = weapons[currentWeapon];
            if (isReloading) {
                reloadTimer += delta;
                const p = Math.min(reloadTimer / weapon.reloadTime, 1);
                reloadBar.style.width = (p * 100) + '%';
                gunGroup.position.y = Math.sin(p * Math.PI) * -0.65;
                if (reloadTimer >= weapon.reloadTime) {
                    isReloading = false;
                    ammo = weapon.maxAmmo;
                    document.getElementById('ammo-display').innerText = `${ammo} / ${weapon.maxAmmo}`;
                    reloadUI.style.display = 'none';
                    gunGroup.position.y = 0;
                }
            } else {
                gunGroup.position.y = Math.sin(Date.now() * 0.0025) * 0.015;
                gunGroup.position.z += (0 - gunGroup.position.z) * Math.min(1, 0.18 * frameScale);
            }

            // 覗き込み時は武器を中央へ寄せ、武器ごとにズーム量を変える
            const aimFov = { pistol: 52, rifle: 43, sniper: 18, shotgun: 48 }[currentWeapon];
            const desiredFov = isAiming ? aimFov : 75;
            camera.fov += (desiredFov - camera.fov) * Math.min(1, delta * 10);
            camera.updateProjectionMatrix();
            if (currentGunModel) {
                const targetX = isAiming ? (currentWeapon === 'sniper' ? -0.02 : 0.02) : 0.32;
                const targetY = isAiming ? -0.22 : -0.28;
                const targetZ = isAiming ? -0.42 : -0.50;
                currentGunModel.position.x += (targetX - currentGunModel.position.x) * Math.min(1, delta * 12);
                currentGunModel.position.y += (targetY - currentGunModel.position.y) * Math.min(1, delta * 12);
                currentGunModel.position.z += (targetZ - currentGunModel.position.z) * Math.min(1, delta * 12);
            }

            updateDummies(delta);
            updateMinimap();
            camera.position.copy(playerPos);
            renderer.render(scene, camera);
        }
        animate();

        function resizeGame() {
            const size = getViewportSize();
            camera.aspect = size.width / size.height;
            camera.updateProjectionMatrix();
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            renderer.setSize(size.width, size.height, false);
        }

        window.addEventListener('resize', resizeGame);
        window.addEventListener('orientationchange', () => requestAnimationFrame(resizeGame));
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', resizeGame);
        }
        resizeGame();
    </script>
</body>
</html>
