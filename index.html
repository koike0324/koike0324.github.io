<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultimate Mobile FPS Arena</title>
    <style>
        html, body {
            width: 100%; height: 100%; margin: 0; overflow: hidden;
            -webkit-user-select: none; user-select: none;
            -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }
        body { position: fixed; inset: 0; background: #87CEEB; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #game-canvas {
            position: fixed; inset: 0; z-index: 0; display: block;
            touch-action: none; -webkit-user-select: none; user-select: none;
        }
        #ui-layer {
            position: fixed; z-index: 10; inset: 0; width: 100%; height: 100%; pointer-events: none;
            -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        }
        #start-screen {
            position: fixed; inset: 0; z-index: 100;
            display: flex; align-items: center; justify-content: center;
            padding: 24px; box-sizing: border-box;
            background: linear-gradient(135deg, rgba(5,12,24,.94), rgba(12,35,48,.82));
            color: #fff; text-align: center; pointer-events: auto;
        }
        #start-panel {
            width: min(520px, 100%); padding: 36px 28px;
            border: 1px solid rgba(255,255,255,.24); border-radius: 18px;
            background: rgba(8,16,28,.78); box-shadow: 0 18px 60px rgba(0,0,0,.45);
            backdrop-filter: blur(10px);
        }
        #start-title { margin: 0 0 8px; font-size: clamp(30px, 7vw, 48px); letter-spacing: 2px; }
        #start-subtitle { margin: 0 0 24px; color: #a9c8d8; font-size: 14px; letter-spacing: 3px; }
        #start-description { margin: 0 auto 18px; color: #d5e0e8; line-height: 1.8; font-size: 14px; }
        #spawn-title { margin: 18px 0 10px; color: #c8dce9; font-size: 13px; letter-spacing: 1.5px; }
        #spawn-options { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 9px; margin: 0 auto 20px; }
        .spawn-option { min-height: 48px; padding: 10px 8px; border: 1px solid rgba(255,255,255,.25); border-radius: 9px; background: rgba(255,255,255,.07); color: #eaf5fb; font-size: 14px; font-weight: 700; cursor: pointer; touch-action: manipulation; }
        .spawn-option.selected { border-color: #45c7ff; background: rgba(25,145,205,.32); box-shadow: inset 0 0 0 1px #45c7ff, 0 0 14px rgba(40,170,230,.18); }
        .spawn-option:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
        #spawn-status { min-height: 18px; margin: -8px 0 16px; color: #9edfff; font-size: 12px; }
        #start-button {
            width: min(280px, 100%); padding: 15px 24px; border: 0; border-radius: 10px;
            background: linear-gradient(135deg,#20a8d8,#1767bd); color: white;
            font-size: 19px; font-weight: 800; letter-spacing: 2px; cursor: pointer;
            box-shadow: 0 6px 22px rgba(20,130,210,.35); touch-action: manipulation;
        }
        #start-button:active { transform: scale(.98); }
        #start-hint { margin: 16px 0 0; color: #91a5b5; font-size: 12px; }
        @media (max-width: 520px) {
            #start-panel { padding: 25px 18px; }
            #spawn-options { gap: 7px; }
            .spawn-option { min-height: 44px; font-size: 13px; }
        }

        #minimap-container {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 150px;
            height: 150px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 4px;
            pointer-events: none;
        }
        #minimap {
            width: 100%;
            height: 100%;
        }

        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 18px; height: 18px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: "";
            position: absolute;
            left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.95);
            box-shadow: 0 0 6px rgba(255,255,255,0.9);
        }
        #crosshair::before {
            width: 2px; height: 18px;
        }
        #crosshair::after {
            width: 18px; height: 2px;
        }

        .btn {
            position: absolute; z-index: 20; pointer-events: auto; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: bold;
            -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent; touch-action: none;
            border: 2px solid rgba(255,255,255,0.4);
            background: rgba(0,0,0,0.3); transition: transform 0.05s;
        }
        .btn:active { transform: scale(0.9); background: rgba(0,0,0,0.5); }

        #joystick-container {
            bottom: 40px; left: 40px; width: 130px; height: 130px;
            border-radius: 50%; border: 2px solid rgba(255,255,255,0.2);
            position: absolute; pointer-events: auto; background: rgba(255,255,255,0.1);
            display: none;
            touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        }
        #joystick-container.mobile-visible { display: block; }
        #joystick-knob {
            position: absolute; top: 40px; left: 40px; width: 50px; height: 50px;
            background: rgba(255,255,255,0.4); border-radius: 50%;
        }

        #fire-button { bottom: 140px; right: 40px; width: 100px; height: 100px; background: rgba(255, 50, 50, 0.6); font-size: 20px; display: none; }
        #fire-button.mobile-visible { display: flex; }
        #jump-button { bottom: 40px; right: 160px; width: 80px; height: 80px; background: rgba(50, 150, 255, 0.6); display: none; }
        #jump-button.mobile-visible { display: flex; }
        #reload-button { bottom: 40px; right: 40px; width: 80px; height: 80px; background: rgba(80, 80, 80, 0.8); font-size: 13px; display: none; }
        #reload-button.mobile-visible { display: flex; }

        #weapon-swap-button { bottom: 220px; right: 40px; width: 80px; height: 80px; background: rgba(255, 200, 0, 0.6); font-size: 12px; display: none; }
        #weapon-swap-button.mobile-visible { display: flex; }

        #reload-container {
            position: absolute; top: 58%; left: 50%; transform: translate(-50%, -50%);
            width: 140px; text-align: center; display: none;
        }
        #reload-text { color: #ff3300; font-weight: bold; font-size: 14px; margin-bottom: 5px; text-shadow: 1px 1px 2px black; }
        #reload-bar-bg { width: 100%; height: 8px; background: rgba(0,0,0,0.5); border-radius: 4px; overflow: hidden; }
        #reload-bar-fill { width: 0%; height: 100%; background: #00ffcc; }

        #ammo-display { position: absolute; top: 20px; left: 20px; font-size: 28px; font-weight: bold; color: #000; text-shadow: 1px 1px 2px rgba(255,255,255,0.8); }
        #weapon-display { position: absolute; top: 60px; left: 20px; font-size: 16px; font-weight: bold; color: #000; text-shadow: 1px 1px 2px rgba(255,255,255,0.8); }
        #pause-open-button {
            position:fixed !important; top:104px !important; left:20px !important;
            z-index:2147483000 !important; display:none; visibility:visible !important;
            padding:6px 11px; min-width:68px; border:1px solid rgba(255,255,255,.8);
            border-radius:7px; background:rgba(20,28,38,.92); color:#fff;
            font-size:11px; font-weight:800; letter-spacing:.5px;
            pointer-events:auto !important; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.55);
        }
        #pause-overlay {
            position:fixed; inset:0; z-index:1000; display:none;
            align-items:center; justify-content:center; padding:20px; box-sizing:border-box;
            background:rgba(0,0,0,.68); color:#fff; pointer-events:auto;
        }
        #pause-panel {
            width:min(320px,100%); padding:26px 22px; box-sizing:border-box;
            text-align:center; border:1px solid rgba(255,255,255,.3);
            border-radius:16px; background:rgba(12,20,32,.96);
            box-shadow:0 12px 40px rgba(0,0,0,.5);
        }
        #pause-panel h2 { margin:0 0 20px; font-size:26px; letter-spacing:2px; }
        #pause-resume {
            width:100%; padding:12px; border:0; border-radius:9px;
            background:#23864b; color:#fff; font-size:16px; font-weight:800;
        }
        #pause-reset {
            width:100%; margin-top:10px; padding:12px; border:1px solid rgba(255,255,255,.2);
            border-radius:9px; background:#a83232; color:#fff; font-size:15px; font-weight:800;
        }
        #dummy-retaliation-toggle {
            width:100%; margin:0 0 10px; padding:11px; border:1px solid rgba(255,255,255,.25);
            border-radius:9px; background:#245b83; color:#fff; font-size:14px; font-weight:800;
        }
        #pause-message { min-height:18px; margin:0 0 12px; color:#ffb4b4; font-size:13px; font-weight:700; }
        #you-died-overlay {
            position:fixed; inset:0; z-index:2147483646; display:none;
            align-items:center; justify-content:center; background:rgba(0,0,0,.58);
            color:#ff3434; font-size:clamp(34px,8vw,68px); font-weight:1000;
            letter-spacing:4px; text-shadow:0 3px 12px #000, 0 0 24px rgba(255,0,0,.55);
            pointer-events:none;
        }
        #health-hud {
            position: fixed !important; display: block !important; visibility: visible !important;
            opacity: 1 !important; z-index: 99999 !important;
            left: 50% !important; right: auto !important;
            bottom: max(18px, env(safe-area-inset-bottom)) !important;
            top: auto !important; transform: translateX(-50%) !important;
            width: min(300px, 46vw) !important; min-width: 190px;
            padding: 10px 14px 11px; box-sizing: border-box;
            border: 2px solid rgba(255,255,255,.8); border-radius: 12px;
            background: rgba(5,12,20,.94); color: #fff;
            text-shadow: 0 1px 3px #000; pointer-events: none;
            box-shadow: 0 3px 14px rgba(0,0,0,.65);
        }
        #health-label-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; font-size:12px; font-weight:800; letter-spacing:1px; }
        #health-value { font-size:13px; font-variant-numeric:tabular-nums; }
        #health-bar-bg { height:11px; overflow:hidden; border-radius:8px; background:rgba(0,0,0,.65); border:1px solid rgba(255,255,255,.22); }
        #health-bar-fill { width:100%; height:100%; border-radius:8px; background:linear-gradient(90deg,#22c55e,#84cc16); transition:width .18s ease,background .18s ease; }
        @media (max-width:700px) {
            #health-hud { bottom: max(18px, env(safe-area-inset-bottom)) !important; width:min(260px,44vw) !important; min-width:190px; padding:9px 12px 10px; }
            #health-label-row { margin-bottom:4px; font-size:10px; }
            #health-value { font-size:11px; }
            #health-bar-bg { height:9px; }
        }
        #aim-toggle {
            position: absolute; top: 190px; right: 20px; left: auto; z-index: 20;
            pointer-events: auto; cursor: pointer;
            padding: 9px 12px; border: 2px solid rgba(255,255,255,0.65);
            border-radius: 8px; background: rgba(35,35,35,0.78); color: white;
            font-size: 13px; font-weight: bold; letter-spacing: 0.3px;
            -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent; touch-action: manipulation;
        }
        #aim-toggle.enabled { background: rgba(20,125,65,0.9); }
        #ads-button { position:absolute; top:240px; right:20px; z-index:20; pointer-events:auto; cursor:pointer; padding:9px 14px; border:2px solid rgba(255,255,255,.65); border-radius:8px; background:rgba(25,45,70,.82); color:white; font-size:13px; font-weight:bold; touch-action:manipulation; }
        @media (max-width: 700px) {
            #ads-button { top:auto; bottom:242px; right:135px; }
        }
        #ads-button.enabled { background:rgba(20,125,65,.92); }
        /* スコープの暗幕はUIより後ろに置き、操作ボタンを隠さない */
        #scope-overlay { display:none; position:fixed; inset:0; z-index:1; pointer-events:none; background:radial-gradient(circle at center, transparent 0 31vmin, rgba(0,0,0,.98) 31.5vmin, #000 100%); }
        #minimap-container, #ammo-display, #weapon-display, #reload-container, #crosshair, #aim-toggle, #ads-button { z-index:20; }
        #scope-overlay::before { content:""; position:absolute; left:50%; top:50%; width:64vmin; height:64vmin; transform:translate(-50%,-50%); border:2px solid rgba(0,0,0,.95); border-radius:50%; box-shadow:0 0 0 2px rgba(220,230,220,.45), inset 0 0 2px rgba(0,0,0,.9); }
        #scope-overlay::after { content:""; position:absolute; left:50%; top:50%; width:64vmin; height:64vmin; transform:translate(-50%,-50%); background:linear-gradient(transparent calc(50% - 1px),rgba(20,20,20,.9) 50%,transparent calc(50% + 1px)),linear-gradient(90deg,transparent calc(50% - 1px),rgba(20,20,20,.9) 50%,transparent calc(50% + 1px)); border-radius:50%; }

        #damage-indicators {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .damage-number {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            color: #ff0000;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }

        #controls-guide {
            position: absolute; bottom: 20px; right: 20px; color: #000; font-size: 12px;
            background: rgba(255,255,255,0.7); padding: 10px 15px; border-radius: 8px;
            text-align: right; line-height: 1.6;
        }
        #controls-guide.hidden { display: none; }

        @supports (padding: max(0px)) {
            #joystick-container {
                bottom: max(40px, env(safe-area-inset-bottom));
                left: max(40px, env(safe-area-inset-left));
            }
            #fire-button {
                bottom: max(140px, calc(140px + env(safe-area-inset-bottom)));
                right: max(40px, env(safe-area-inset-right));
            }
            #jump-button {
                bottom: max(40px, env(safe-area-inset-bottom));
                right: max(160px, calc(160px + env(safe-area-inset-right)));
            }
            #reload-button {
                bottom: max(40px, env(safe-area-inset-bottom));
                right: max(40px, env(safe-area-inset-right));
            }
            #weapon-swap-button {
                bottom: max(220px, calc(220px + env(safe-area-inset-bottom)));
                right: max(40px, env(safe-area-inset-right));
            }
            #controls-guide {
                bottom: max(20px, env(safe-area-inset-bottom));
                right: max(20px, env(safe-area-inset-right));
            }
            #ammo-display {
                top: max(20px, env(safe-area-inset-top));
                left: max(20px, env(safe-area-inset-left));
            }
            #weapon-display {
                top: max(60px, calc(60px + env(safe-area-inset-top)));
                left: max(20px, env(safe-area-inset-left));
            }
            #aim-toggle {
                top: max(190px, calc(190px + env(safe-area-inset-top)));
                right: max(20px, env(safe-area-inset-right));
                left: auto;
            }
            #minimap-container {
                top: max(20px, env(safe-area-inset-top));
                right: max(20px, env(safe-area-inset-right));
            }
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <div id="start-panel">
            <h1 id="start-title">FPS ARENA</h1>
            <p id="start-subtitle">TACTICAL COMBAT</p>
            <p id="start-description">最初に出現するエリアを選択しよう。選んだエリア内でリスポーンするよ。</p>
            <h2 id="spawn-title">RESPAWN LOCATION</h2>
            <div id="spawn-options" role="group" aria-label="リスポーンエリア">
                <button class="spawn-option selected" type="button" data-area="plains" aria-pressed="true">🌿 平原</button>
                <button class="spawn-option" type="button" data-area="hills" aria-pressed="false">⛰️ 丘</button>
                <button class="spawn-option" type="button" data-area="city" aria-pressed="false">🏙️ 都会</button>
                <button class="spawn-option" type="button" data-area="random" aria-pressed="false">🎲 ランダム</button>
            </div>
            <p id="spawn-status" aria-live="polite">選択中：平原</p>
            <button id="start-button" type="button">GAME START</button>
            <p id="start-hint">PC：WASDで移動・マウスで視点操作<br>スマホ：画面のコントローラーで操作</p>
        </div>
    </div>

    <div id="pause-overlay" role="dialog" aria-modal="true" aria-labelledby="pause-title">
        <div id="pause-panel">
            <h2 id="pause-title">PAUSED</h2>
            <p id="pause-message" aria-live="polite"></p>
            <button id="dummy-retaliation-toggle" type="button" aria-pressed="true">ダミーの反撃：ON</button>
            <button id="pause-resume" type="button">ゲームに戻る</button>
            <button id="pause-reset" type="button">リセット（死亡して復帰）</button>
        </div>
    </div>

    <div id="you-died-overlay" role="alert" aria-live="assertive">YOU DIED</div>

    <div id="ui-layer">
        <div id="crosshair"></div>
        <div id="ammo-display">15 / 15</div>
        <div id="weapon-display">PISTOL</div>
        <button id="pause-open-button" type="button" aria-label="ポーズメニューを開く">Ⅱ PAUSE</button>
        <button id="aim-toggle" type="button" aria-pressed="false">AUTO AIM: OFF</button>
        <button id="ads-button" type="button" aria-pressed="false">AIM: OFF</button>
        <div id="scope-overlay" aria-hidden="true"></div>

        <div id="reload-container">
            <div id="reload-text">RELOADING</div>
            <div id="reload-bar-bg"><div id="reload-bar-fill"></div></div>
        </div>

        <div id="minimap-container">
            <canvas id="minimap"></canvas>
        </div>

        <div id="damage-indicators"></div>

        <div id="joystick-container"><div id="joystick-knob"></div></div>
        <div id="fire-button" class="btn">FIRE</div>
        <div id="jump-button" class="btn">JUMP</div>
        <div id="weapon-swap-button" class="btn">SWAP<br>GUN</div>
        <div id="reload-button" class="btn">RELOAD</div>

        <div id="controls-guide">
            <div>WASD: 移動</div>
            <div>Mouse: 視点</div>
            <div>Click: 射撃 / 右クリック長押し: 覗く</div>
            <div>Space: ジャンプ</div>
            <div>R: リロード</div>
            <div>E: 武器切り替え</div>
        </div>
    </div>

    <div id="health-hud" role="status" aria-label="プレイヤー体力">
            <div id="health-label-row"><span>HP</span><span id="health-value">100 / 100</span></div>
            <div id="health-bar-bg"><div id="health-bar-fill"></div></div>
        </div>
    
    <script type="importmap">
        { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ゲーム中の長押し選択・コピー用メニュー・ダブルタップ拡大を防ぐ
        document.addEventListener('selectstart', e => e.preventDefault());
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('dblclick', e => e.preventDefault());

        // Edge / Safari の iPad は userAgent がPC扱いになることがあるため、タッチ対応も判定する
        const isIPadOS = /Macintosh/i.test(navigator.userAgent) && navigator.maxTouchPoints > 1;
        const hasTouchInput = (navigator.maxTouchPoints || 0) > 0 ||
            ('ontouchstart' in window) ||
            (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || isIPadOS || hasTouchInput;
        const isTablet = window.innerWidth > 600 && (isIPadOS || /iPad|Android/i.test(navigator.userAgent) || hasTouchInput);

        if(isMobile) {
            document.getElementById('joystick-container').classList.add('mobile-visible');
            document.getElementById('fire-button').classList.add('mobile-visible');
            document.getElementById('jump-button').classList.add('mobile-visible');
            document.getElementById('weapon-swap-button').classList.add('mobile-visible');
            document.getElementById('reload-button').classList.add('mobile-visible');
            document.getElementById('controls-guide').classList.add('hidden');
        } else {
            document.getElementById('controls-guide').classList.remove('hidden');
        }

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 15, 100);

        const getViewportSize = () => {
            // iPad Safari のアドレスバーや画面回転で変わる表示領域にも追従する
            const viewport = window.visualViewport;
            return {
                width: Math.max(1, Math.round(viewport?.width || document.documentElement.clientWidth || window.innerWidth)),
                height: Math.max(1, Math.round(viewport?.height || document.documentElement.clientHeight || window.innerHeight))
            };
        };

        const initialSize = getViewportSize();
        const camera = new THREE.PerspectiveCamera(75, initialSize.width / initialSize.height, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.domElement.id = 'game-canvas';
        renderer.domElement.style.cssText = 'position:fixed;inset:0;display:block;width:100%;height:100%;';
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(initialSize.width, initialSize.height, false);
        document.body.appendChild(renderer.domElement);
        // ポーズボタンはUIレイヤーの重なり順に影響されないようbody直下へ移動
        const pauseOpenButton = document.getElementById('pause-open-button');
        document.body.appendChild(pauseOpenButton);


        // HP表示をcanvas生成後にbody末尾へ移し、PC・スマホ両方で最前面に固定
        const healthHud = document.getElementById('health-hud');
        document.body.appendChild(healthHud);
        healthHud.style.cssText += ';position:fixed!important;display:block!important;visibility:visible!important;opacity:1!important;z-index:2147483647!important;left:50%!important;right:auto!important;top:auto!important;bottom:18px!important;transform:translateX(-50%)!important;width: min(300px, 46vw)!important;min-width:190px!important;pointer-events:none!important;';
        
        const light = new THREE.HemisphereLight(0xffffff, 0x80bb88, 2);
        scene.add(light);

        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(380, 300),
            new THREE.MeshStandardMaterial({
                color: 0x2d8a3d,
                roughness: 0.8,
                side: THREE.DoubleSide,
                map: new THREE.CanvasTexture((function() {
                    const canvas = document.createElement('canvas');

        // 3エリアの範囲。プレイヤーはこの外周を越えられない
        const AREA_BOUNDS = {

        function findOpenPosition(margin = 2, maxAttempts = 100) {

                const x = DUMMY_BOUNDS.minX + Math.random() * (DUMMY_BOUNDS.maxX - DUMMY_BOUNDS.minX);
                const z = DUMMY_BOUNDS.minZ + Math.random() * (DUMMY_BOUNDS.maxZ - DUMMY_BOUNDS.minZ);
                const blocked = colliders.some(c =>
                    x > c.minX - margin && x < c.maxX + margin &&
                    z > c.minZ - margin && z < c.maxZ + margin

                if (!blocked) return { x, z };
            }
            return { x: 0, z: 0 };

        // エリア中央を基準に、障害物に重ならない最も近い地点を探す
        function findAreaCenterSpawn(area, margin = 1.2) {
            const b = AREA_BOUNDS[area];
            // 各エリアの中心をダミーの出現基準地点にする
            const centerX = b.centerX;
            const centerZ = b.centerZ;
            for (let radius = 0; radius <= 28; radius += 2) {
                for (let dx = -radius; dx <= radius; dx += 2) {
                    for (const dz of (radius === 0 ? [0] : [-radius, radius])) {
                        const x = centerX + dx, z = centerZ + dz;
                        if (x < b.minX + margin || x > b.maxX - margin || z < b.minZ + margin || z > b.maxZ - margin) continue;
                        if (!checkCollision(x, z, margin)) return { x, z };
                    }
                }
                for (let dz = -radius + 2; dz <= radius - 2; dz += 2) {
                    for (const dx of [-radius, radius]) {
                        const x = centerX + dx, z = centerZ + dz;
                        if (x < b.minX + margin || x > b.maxX - margin || z < b.minZ + margin || z > b.maxZ - margin) continue;
                        if (!checkCollision(x, z, margin)) return { x, z };
                    }

            return { x: centerX, z: centerZ };

        let isReloading = false;

            if (currentGunModel) {

        createGunModel('pistol');

        // iPadでも開始時に地面と建物が確実に視界へ入るよう、初期視点を下向きにする

        const minimapCanvas = document.getElementById('minimap');
        const minimapCtx = minimapCanvas.getContext('2d');
        minimapCanvas.width = 150;
        minimapCanvas.height = 150;
        // アリーナ全体がミニマップに収まる縮尺（横幅・奥行きの大きい方に合わせる）
        const MINIMAP_SCALE = 150 / Math.max(
            DUMMY_BOUNDS.maxX - DUMMY_BOUNDS.minX,
            DUMMY_BOUNDS.maxZ - DUMMY_BOUNDS.minZ
        );
        const MINIMAP_OFFSET_Y = (150 - (DUMMY_BOUNDS.maxZ - DUMMY_BOUNDS.minZ) * MINIMAP_SCALE) / 2;
        const mapX = x => (x - DUMMY_BOUNDS.minX) * MINIMAP_SCALE;
        const mapY = z => (DUMMY_BOUNDS.maxZ - z) * MINIMAP_SCALE + MINIMAP_OFFSET_Y;

        function updateMinimap() {
            minimapCtx.fillStyle = '#2a2a2a';
            minimapCtx.fillRect(0, 0, minimapCanvas.width, minimapCanvas.height);

            minimapCtx.strokeStyle = '#444444';
            minimapCtx.lineWidth = 0.5;
            for(let i = 0; i <= 10; i++) {
                minimapCtx.beginPath();
                minimapCtx.moveTo(i * 15, 0);
                minimapCtx.lineTo(i * 15, minimapCanvas.height);
                minimapCtx.stroke();
            }

            minimapCtx.fillStyle = '#8b7d72';
            for(const c of colliders) {
                const px = mapX(c.minX);
                const py = mapY(c.maxZ);
                const pw = (c.maxX - c.minX) * MINIMAP_SCALE;
                const ph = (c.maxZ - c.minZ) * MINIMAP_SCALE;
                minimapCtx.fillRect(px, py, pw, ph);
            }

            minimapCtx.fillStyle = '#ff9999';
            for(const dummy of dummies) {
                if(!dummy.isAlive) continue;
                const px = mapX(dummy.group.position.x);
                const py = mapY(dummy.group.position.z);
                minimapCtx.beginPath();
                minimapCtx.arc(px, py, 3, 0, Math.PI * 2);
                minimapCtx.fill();
            }

            minimapCtx.fillStyle = '#00ff00';
            const playerPx = mapX(playerPos.x);
            const playerPy = mapY(playerPos.z);
            minimapCtx.beginPath();
            minimapCtx.arc(playerPx, playerPy, 4, 0, Math.PI * 2);
            minimapCtx.fill();

            minimapCtx.strokeStyle = '#00ff00';
            minimapCtx.lineWidth = 2;
            minimapCtx.beginPath();
            minimapCtx.moveTo(playerPx, playerPy);
            const dirX = Math.sin(yaw) * 8;
            const dirZ = Math.cos(yaw) * 8;
            minimapCtx.lineTo(playerPx + dirX, playerPy - dirZ);
            minimapCtx.stroke();
        }

        const keys = {};
        function clearInputState() {

        window.addEventListener('keydown', e => {

            }
            if (e.key.toLowerCase() === 'r') {

        renderer.domElement.addEventListener('click', () => {

        });

        document.addEventListener('mousemove', e => {
            if (document.pointerLockElement === document.body) {

                pitch = Math.max(-1.45, Math.min(1.45, pitch));

        });

        renderer.domElement.addEventListener('mousedown', () => {

        // Pointer Events でタッチ・マウスを統一し、iPad Edge/Safari の入力差を減らす
        const lookState = { pointerId: null, x: 0, y: 0 };
        window.addEventListener('pointerdown', e => {
            if (e.pointerType === 'mouse' || e.target.closest('#joystick-container')) return;
            // FIREボタンを押したまま、その指を動かしても視点を動かせるようにする
            // JUMP / RELOAD / SWAP などのボタン操作は視点移動として扱わない
            const isFireButton = e.target.closest('#fire-button');
            if (e.target.closest('.btn') && !isFireButton) return;
            const triggerPoint = isTablet ? window.innerWidth * 0.4 : window.innerWidth / 2;
            if ((e.clientX > triggerPoint || isFireButton) && lookState.pointerId === null) {
                lookState.pointerId = e.pointerId;
                lookState.x = e.clientX;
                lookState.y = e.clientY;
            }
        }, { passive: true });

        window.addEventListener('pointermove', e => {
            if (e.pointerId !== lookState.pointerId) return;
            yaw -= (e.clientX - lookState.x) * 0.0055;
            pitch -= (e.clientY - lookState.y) * 0.0055;
            pitch = Math.max(-1.45, Math.min(1.45, pitch));
            lookState.x = e.clientX;
            lookState.y = e.clientY;
        });

        const releaseLook = e => {
            if (e.pointerId === lookState.pointerId) lookState.pointerId = null;
        };
        window.addEventListener('pointerup', releaseLook);
        window.addEventListener('pointercancel', releaseLook);

        const joy = document.getElementById('joystick-container');
        const knob = document.getElementById('joystick-knob');
        let joyPointerId = null;

        function updateJoystick(clientX, clientY) {
            const r = joy.getBoundingClientRect();
            const dx = clientX - (r.left + r.width / 2);
            const dy = clientY - (r.top + r.height / 2);
            const dist = Math.hypot(dx, dy);
            const d = Math.min(dist, 50);
            const a = dist > 0 ? Math.atan2(dy, dx) : 0;
            knob.style.transform = `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d}px)`;
            moveR = (d / 50) * Math.cos(a);
            moveF = -(d / 50) * Math.sin(a);
        }

        joy.addEventListener('pointerdown', e => {
            e.preventDefault();
            if (joyPointerId !== null) return;
            joyPointerId = e.pointerId;
            joy.setPointerCapture(e.pointerId);
            updateJoystick(e.clientX, e.clientY);
        });
        joy.addEventListener('pointermove', e => {
            if (e.pointerId !== joyPointerId) return;
            e.preventDefault();
            updateJoystick(e.clientX, e.clientY);
        });
        const releaseJoystick = e => {
            if (e.pointerId !== joyPointerId) return;
            moveF = 0;
            moveR = 0;
            knob.style.transform = 'translate(0,0)';
            joyPointerId = null;
        };
        joy.addEventListener('pointerup', releaseJoystick);
        joy.addEventListener('pointercancel', releaseJoystick);
        joy.addEventListener('lostpointercapture', releaseJoystick);

        const ray = new THREE.Raycaster();
        const aimRay = new THREE.Raycaster();
        let autoAimEnabled = false;
        const aimToggle = document.getElementById('aim-toggle');
        function toggleAutoAim(e) {
            e.preventDefault();
            e.stopPropagation();
            autoAimEnabled = !autoAimEnabled;
            aimToggle.textContent = autoAimEnabled ? 'AUTO AIM: ON' : 'AUTO AIM: OFF';
            aimToggle.classList.toggle('enabled', autoAimEnabled);
            aimToggle.setAttribute('aria-pressed', String(autoAimEnabled));
        }
        // タッチ端末でも確実に反応するよう Pointer Events で切り替える
        aimToggle.addEventListener('pointerdown', toggleAutoAim);

        // ONの間は狙いを少しずつ補正する。ロック対象を維持して視点の揺れを防ぐ
        let lockedAimDummy = null;
        function updateAutoAim(delta) {
            if (!autoAimEnabled) {
                lockedAimDummy = null;
                return;
            }

            const origin = playerPos.clone();
            const viewQuaternion = new THREE.Quaternion().setFromEuler(
                new THREE.Euler(pitch, yaw, 0, 'YXZ')
            );
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(viewQuaternion).normalize();
            const blockers = scene.children.filter(object => object.userData.blocksShots);

            const isVisibleTarget = dummy => {
                if (!dummy || !dummy.isAlive) return null;
                const center = new THREE.Vector3(
                    dummy.group.position.x,
                    dummy.group.position.y + 1.0,
                    dummy.group.position.z
                );
                const toTarget = center.clone().sub(origin);
                const distance = toTarget.length();
                if (distance < 0.1) return null;
                const direction = toTarget.clone().normalize();
                if (forward.dot(direction) < 0.35) return null;

                aimRay.set(origin, direction);
                aimRay.far = distance;
                const obstruction = aimRay.intersectObjects(blockers, false)[0];
                if (obstruction && obstruction.distance < distance - 0.15) return null;

                const projected = center.clone().project(camera);
                if (projected.z < -1 || projected.z > 1) return null;
                return { center, distance, screenDistance: Math.hypot(projected.x, projected.y) };
            };

            // 現在の対象を優先し、対象が視界から外れたときだけ別の敵を選ぶ
            let target = isVisibleTarget(lockedAimDummy);
            if (!target || target.screenDistance > 0.5) {
                lockedAimDummy = null;
                let bestScore = Infinity;
                for (const dummy of dummies) {
                    const candidate = isVisibleTarget(dummy);
                    if (!candidate || candidate.screenDistance > 0.3) continue;
                    const score = candidate.screenDistance + candidate.distance * 0.0005;
                    if (score < bestScore) {
                        bestScore = score;
                        lockedAimDummy = dummy;
                        target = candidate;
                    }
                }
            }
            if (!target) return;

            const direction = target.center.clone().sub(origin).normalize();
            const targetYaw = Math.atan2(-direction.x, -direction.z);
            const targetPitch = Math.asin(Math.max(-1, Math.min(1, direction.y)));
            const angleDelta = angle => Math.atan2(Math.sin(angle), Math.cos(angle));

            // 補正を弱め、手動エイムを邪魔しない滑らかな追尾にする
            const trackingStrength = 1 - Math.exp(-Math.max(0, delta) * 2.2);
            yaw += angleDelta(targetYaw - yaw) * trackingStrength;
            pitch += (targetPitch - pitch) * trackingStrength;
            pitch = Math.max(-1.45, Math.min(1.45, pitch));
        }

        let lastShotTime = 0;

        function showDamageIndicator(damage, screenX, screenY) {
            const damageEl = document.createElement('div');
            damageEl.className = 'damage-number';
            damageEl.innerText = damage;
            damageEl.style.left = screenX + 'px';
            damageEl.style.top = screenY + 'px';
            damageIndicatorsContainer.appendChild(damageEl);

            let opacity = 1;
            let offsetY = 0;
            const startTime = Date.now();

            function animate() {
                const elapsed = (Date.now() - startTime) / 1000;
                if (elapsed > 1.2) {
                    damageEl.remove();
                    return;
                }

                offsetY = elapsed * 40;
                opacity = Math.max(0, 1 - (elapsed / 1.2));
                damageEl.style.opacity = opacity;
                damageEl.style.transform = `translateY(-${offsetY}px)`;

                requestAnimationFrame(animate);
            }
            animate();
        }

        function shoot() {
            if (isPaused) return;
            const weapon = weapons[currentWeapon];
            if (ammo <= 0 || isReloading) return;
            const now = Date.now() / 1000;
            if (now - lastShotTime < weapon.fireRate) return;

            lastShotTime = now;
            ammo--;
            document.getElementById('ammo-display').innerText = `${ammo} / ${weapon.maxAmmo}`;
            gunGroup.position.z += 0.22;

            // 武器ごとの射程と拡散を反映。照準中は弾のばらつきを抑える
            const spread = isAiming ? weapon.aimSpread : weapon.spreadAngle;
            const shotX = (Math.random() - 0.5) * spread * 2;
            const shotY = (Math.random() - 0.5) * spread * 2;
            ray.setFromCamera(new THREE.Vector2(0, 0), camera);
            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
            const up = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
            ray.ray.direction.addScaledVector(right, shotX).addScaledVector(up, shotY).normalize();
            ray.far = weapon.range;

            // 壁・ターゲット・生存中の敵を同じレイで調べ、最も近い交差だけを処理する
            const blockers = scene.children.filter(object => object.userData.blocksShots);
            const targetMeshes = targets.filter(target => target.scale.x !== 0);
            const dummyMeshes = [];
            for (const dummy of dummies) {
                if (!dummy.isAlive) continue;
                for (const mesh of [dummy.body, dummy.head, dummy.leftArm, dummy.rightArm, dummy.leftLeg, dummy.rightLeg]) {
                    dummyMeshes.push(mesh);
                }
            }

            // 念のため未定義・非Meshを除外し、無効な候補で射撃処理が停止しないようにする
            const candidates = [...blockers, ...targetMeshes, ...dummyMeshes]
                .filter(object => object && object.isObject3D && typeof object.raycast === 'function');
            // 敵の各部位は直接Meshを渡して判定する
            const hits = ray.intersectObjects(candidates, false);
            if (hits.length === 0) return;

            const hit = hits[0];
            // 最初に当たったのが壁・箱なら、後ろの敵やターゲットには命中させない
            if (hit.object.userData.blocksShots) return;

            if (targets.includes(hit.object)) {
                const target = hit.object;
                target.scale.set(0, 0, 0);
                showDamageIndicator(weapon.damage, window.innerWidth / 2, window.innerHeight / 2 - 50);
                setTimeout(() => {
                    target.scale.set(1, 1, 1);
                    const pos = findOpenPosition(2);
                    target.position.set(pos.x, 2 + Math.random() * 4, pos.z);
                }, 2000);
                return;
            }

            const dummy = dummies.find(item =>
                item.isAlive &&
                [item.body, item.head, item.leftArm, item.rightArm, item.leftLeg, item.rightLeg].includes(hit.object)
            );
            if (!dummy) return;

            // 頭部命中は威力アップ。ショットガンは近距離で強く、距離が離れると威力低下
            let actualDamage = weapon.damage;
            if (currentWeapon === 'shotgun' && hit.distance > 10) {
                actualDamage = Math.max(16, Math.round(weapon.damage * (1 - (hit.distance - 10) / 18)));
            }
            if (hit.object === dummy.head) actualDamage = Math.min(100, Math.round(actualDamage * 1.5));
            dummy.health -= actualDamage;
            dummy.hitFlashTimer = dummy.hitFlashDuration;
            showDamageIndicator(actualDamage, window.innerWidth / 2, window.innerHeight / 2 - 50);

            if (dummy.health <= 0 && dummy.isAlive) {
                dummy.isAlive = false;
                dummy.respawnTimer = 3.0;
                dummy.group.visible = false;
            }
        }

        function swapWeapon() {
            const weaponList = ['pistol', 'rifle', 'sniper', 'shotgun'];
            const currentIndex = weaponList.indexOf(currentWeapon);
            currentWeapon = weaponList[(currentIndex + 1) % weaponList.length];
            ammo = weapons[currentWeapon].maxAmmo;
            isReloading = false;
            isFiring = false;
            reloadUI.style.display = 'none';
            gunGroup.position.y = 0;
            gunGroup.position.z = 0;

            document.getElementById('weapon-display').innerText = currentWeapon.toUpperCase();
            document.getElementById('ammo-display').innerText = `${ammo} / ${weapons[currentWeapon].maxAmmo}`;
            createGunModel(currentWeapon);
            setAiming(false);
        }

        function startReload() {
            const weapon = weapons[currentWeapon];
            if (!isReloading && ammo < weapon.maxAmmo) {
                isReloading = true;
                isFiring = false;
                reloadTimer = 0;
                reloadUI.style.display = 'block';
            }
        }

        const fireButton = document.getElementById('fire-button');
        function beginFiring(e) {
            e.preventDefault();
            if (weapons[currentWeapon].isAutomatic) {
                isFiring = true;
            } else {
                isFiring = false;
                shoot();
            }
            if (e.pointerId !== undefined && fireButton.setPointerCapture) {
                try { fireButton.setPointerCapture(e.pointerId); } catch (_) {}
            }
        }
        fireButton.addEventListener('pointerdown', beginFiring);
        const stopFiring = () => { isFiring = false; };
        fireButton.addEventListener('pointerup', stopFiring);
        fireButton.addEventListener('pointercancel', stopFiring);
        fireButton.addEventListener('lostpointercapture', stopFiring);

        document.getElementById('jump-button').addEventListener('pointerdown', e => {
            e.preventDefault();
            if (isGrounded) {
                velocityY = 0.36;
                isGrounded = false;
            }
        });
        document.getElementById('weapon-swap-button').addEventListener('pointerdown', e => {
            e.preventDefault();
            swapWeapon();
        });
        document.getElementById('reload-button').addEventListener('pointerdown', e => {
            e.preventDefault();
            startReload();
        });

        function checkCollision(x, z, radius) {
            for (const c of colliders) {
                const closestX = Math.max(c.minX, Math.min(x, c.maxX));
                const closestZ = Math.max(c.minZ, Math.min(z, c.maxZ));
                const distX = x - closestX;
                const distZ = z - closestZ;
                const distSq = distX * distX + distZ * distZ;

                if (distSq < radius * radius) {
                    return true;
                }
            }
            return false;
        }

        // 各エリアの安全な候補地点。実際の障害物と重なる候補は選ばない
        const SPAWN_POINTS = {
            plains: [[-57,18],[58,18],[-57,-42],[58,-42],[-2,33],[53,33]],
            hills: [[-168,0],[-40,0],[-168,-115],[-35,-165],[-170,-80],[-40,-20]],
            city: [[98,-92],[98,-38],[98,-145],[30,-92],[170,-92]]
        };
        const SPAWN_AREA_NAMES = {plains:'平原', hills:'丘', city:'都会'};
        function getSpawnPosition(area) {
            const candidates = (SPAWN_POINTS[area] || SPAWN_POINTS.plains)
                .filter(([x,z]) => !checkCollision(x,z,PLAYER_RADIUS + 0.25));
            const pool = candidates.length ? candidates : SPAWN_POINTS[area] || SPAWN_POINTS.plains;
            const [x,z] = pool[Math.floor(Math.random() * pool.length)];
            return {x,z};
        }

        // エリア選択を維持して再出現。random選択時だけ、復帰ごとにエリアも抽選する
        function respawnPlayer(rerollRandomArea = true) {
            if (selectedSpawnArea === 'random' && rerollRandomArea) {
                const areas = ['plains','hills','city'];
                activeSpawnArea = areas[Math.floor(Math.random() * areas.length)];
            } else if (selectedSpawnArea !== 'random') {
                activeSpawnArea = selectedSpawnArea;
            }
            const spawn = getSpawnPosition(activeSpawnArea);
            playerPos.set(spawn.x, 1.6, spawn.z);
            playerHP = MAX_PLAYER_HP;
            playerDeathPending = false;
            updatePlayerHealthUI();
            velocityY = 0;
            isGrounded = true;
            yaw = 0;
            pitch = -0.35;
            clearInputState();
            return spawn;
        }

        function updateDummies(delta) {
            for (const dummy of dummies) {
                if (!dummy.isAlive) {
                    dummy.respawnTimer = Math.max(0, dummy.respawnTimer - delta);
                    if (dummy.respawnTimer <= 0) {
                        // 倒された場所ではなく、各エリアの安全な中央付近に3秒後復帰
                        const pos = findAreaCenterSpawn(dummy.area, 1.2);
                        dummy.spawnCenter = pos;
                        dummy.group.position.set(pos.x, 0, pos.z);
                        dummy.health = dummy.maxHealth;
                        dummy.hitFlashTimer = 0;
                        dummy.renderedHealth = -1;
                        dummy.group.visible = true;
                        dummy.group.scale.set(1, 1, 1);
                        dummy.isAlive = true;
                        dummy.respawnTimer = 0;
                    }
                    continue;
                }

                const dx = playerPos.x - dummy.group.position.x;
                const dz = playerPos.z - dummy.group.position.z;
                const distanceToPlayer = Math.hypot(dx, dz);
                const chasing = dummyRetaliationEnabled && !playerDeathPending && distanceToPlayer < 36;
                const aimingAtPlayer = chasing && distanceToPlayer <= 18;

                // 近づくとプレイヤーを追いかけ、一定距離まで来ると反撃の構えを取る
                if (chasing) {
                    dummy.group.rotation.y = Math.atan2(dx, dz);
                    if (aimingAtPlayer) {
                        dummy.attackTimer -= delta;
                        if (dummy.attackTimer <= 0) {
                            playerHP = Math.max(0, playerHP - 3);
                            updatePlayerHealthUI();
                            dummy.attackTimer = 4.5;
                            dummy.shootPoseTimer = 0.28;
                            if (playerHP <= 0 && !playerDeathPending) {
                                playerDeathPending = true;
                                clearInputState();
                                const deathOverlay = document.getElementById('you-died-overlay');
                                deathOverlay.style.display = 'flex';
                                setTimeout(() => {
                                    respawnPlayer(false);
                                    deathOverlay.style.display = 'none';
                                }, 1400);
                            }
                        }
                    }
                }

                dummy.shootPoseTimer = Math.max(0, dummy.shootPoseTimer - delta);
                const poseTarget = aimingAtPlayer ? 1 : 0;
                dummy.attackPose += (poseTarget - dummy.attackPose) * Math.min(1, delta * 5);

                let moveDir = dummy.moveDir;
                let moveSpeed = 0.08;
                if (chasing && distanceToPlayer > 9) {
                    moveDir = Math.atan2(dz, dx);
                    moveSpeed = 0.14;
                } else if (chasing) {
                    moveSpeed = 0;
                } else {
                    dummy.wanderTimer += delta;
                    if (dummy.wanderTimer > dummy.wanderInterval) {
                        dummy.moveDir = Math.random() * Math.PI * 2;
                        dummy.wanderInterval = 2 + Math.random() * 4;
                        dummy.wanderTimer = 0;
                    }
                }

                const areaBounds = AREA_BOUNDS[dummy.area] || DUMMY_BOUNDS;
                let newX = dummy.group.position.x + Math.cos(moveDir) * moveSpeed * delta * 60;
                let newZ = dummy.group.position.z + Math.sin(moveDir) * moveSpeed * delta * 60;
                newX = Math.max(areaBounds.minX + 1, Math.min(newX, areaBounds.maxX - 1));
                newZ = Math.max(areaBounds.minZ + 1, Math.min(newZ, areaBounds.maxZ - 1));

                if (moveSpeed > 0 && !checkCollision(newX, newZ, 0.35)) {
                    dummy.group.position.x = newX;
                    dummy.group.position.z = newZ;
                    if (!chasing) dummy.group.rotation.y = moveDir;
                } else if (moveSpeed > 0) {
                    // 障害物に当たったら横方向だけでも進めるようにする
                    if (!checkCollision(newX, dummy.group.position.z, 0.35)) dummy.group.position.x = newX;
                    else if (!checkCollision(dummy.group.position.x, newZ, 0.35)) dummy.group.position.z = newZ;
                    else if (!chasing) dummy.moveDir = Math.random() * Math.PI * 2;
                }

                const walkCycle = (Date.now() * 0.01) % (Math.PI * 2);
                const firingPose = dummy.attackPose;
                const recoil = dummy.shootPoseTimer > 0 ? Math.sin((dummy.shootPoseTimer / 0.28) * Math.PI) * 0.18 : 0;
                dummy.leftArm.rotation.z = Math.sin(walkCycle) * 0.3 * (1 - firingPose);
                dummy.rightArm.rotation.z = Math.sin(walkCycle + Math.PI) * 0.3 * (1 - firingPose);
                dummy.leftArm.rotation.x = -0.95 * firingPose;
                dummy.rightArm.rotation.x = (-1.12 - recoil) * firingPose;
                dummy.leftLeg.rotation.x = Math.sin(walkCycle) * 0.2;
                dummy.rightLeg.rotation.x = Math.sin(walkCycle + Math.PI) * 0.2;

                // ダメージフラッシュ更新
                if (dummy.hitFlashTimer > 0) {
                    dummy.hitFlashTimer -= delta;
                    const flashIntensity = dummy.hitFlashTimer / dummy.hitFlashDuration;
                    dummy.body.material.color.setHex(0xFF4444);
                    dummy.body.material.emissive.setHex(0xFF0000);
                    dummy.body.material.emissiveIntensity = flashIntensity * 0.8;
                } else {
                    dummy.body.material.color.setHex(dummy.originalBodyColor);
                    dummy.body.material.emissive.setHex(0x000000);
                    dummy.body.material.emissiveIntensity = 0;
                }

                // ヘルスバーは一度だけ作り、体力が変わったときだけテクスチャを更新する
                if (!dummy.healthBarCanvas) {
                    dummy.healthBarCanvas = document.createElement('canvas');
                    dummy.healthBarCanvas.width = 64;
                    dummy.healthBarCanvas.height = 8;
                    dummy.healthBarTexture = new THREE.CanvasTexture(dummy.healthBarCanvas);
                    dummy.healthBarMaterial = new THREE.MeshBasicMaterial({
                        map: dummy.healthBarTexture,
                        transparent: true,
                        depthWrite: false,
                        side: THREE.DoubleSide
                    });
                    dummy.healthBar = new THREE.Mesh(
                        new THREE.PlaneGeometry(0.8, 0.1),
                        dummy.healthBarMaterial
                    );
                    dummy.healthBar.position.y = 2.5;
                    dummy.healthBar.userData.isHealthBar = true;
                    dummy.group.add(dummy.healthBar);
                    dummy.renderedHealth = -1;
                }

                if (dummy.renderedHealth !== dummy.health) {
                    const healthPercent = Math.max(0, Math.min(1, dummy.health / dummy.maxHealth));
                    const ctx = dummy.healthBarCanvas.getContext('2d');
                    ctx.clearRect(0, 0, 64, 8);
                    ctx.fillStyle = '#222222';
                    ctx.fillRect(0, 0, 64, 8);
                    ctx.fillStyle = healthPercent > 0.5 ? '#00ff00' : healthPercent > 0.25 ? '#ffff00' : '#ff0000';
                    ctx.fillRect(0, 0, 64 * healthPercent, 8);
                    dummy.healthBarTexture.needsUpdate = true;
                    dummy.renderedHealth = dummy.health;
                }
                // 敵の向きに関係なく、体力バーをプレイヤー側へ向ける
                dummy.healthBar.quaternion.copy(camera.quaternion);
            }
        }

        const clock = new THREE.Clock();
        let gameStarted = false;
        let isPaused = false;
        let dummyRetaliationEnabled = true;
        let playerDeathPending = false;
        const pauseOverlay = document.getElementById('pause-overlay');
        const dummyRetaliationButton = document.getElementById('dummy-retaliation-toggle');
        function updateDummyRetaliationButton() {
            dummyRetaliationButton.textContent = 'ダミーの反撃：' + (dummyRetaliationEnabled ? 'ON' : 'OFF');
            dummyRetaliationButton.setAttribute('aria-pressed', String(dummyRetaliationEnabled));
            dummyRetaliationButton.style.background = dummyRetaliationEnabled ? '#245b83' : '#555';
        }
        dummyRetaliationButton.addEventListener('click', () => {
            dummyRetaliationEnabled = !dummyRetaliationEnabled;
            updateDummyRetaliationButton();
        });
        updateDummyRetaliationButton();
        function setPaused(value) {
            if (!gameStarted) return;
            isPaused = Boolean(value);
            pauseOverlay.style.display = isPaused ? 'flex' : 'none';
            if (isPaused && document.pointerLockElement && document.exitPointerLock) {
                document.exitPointerLock();
            } else if (!isPaused && !isMobile && document.body.requestPointerLock) {
                document.body.requestPointerLock();
            }
        }
        document.getElementById('pause-open-button').addEventListener('click', () => setPaused(true));
        document.getElementById('pause-resume').addEventListener('click', () => setPaused(false));
        document.getElementById('pause-reset').addEventListener('click', () => {
            if (!gameStarted || !isPaused) return;
            const resetButton = document.getElementById('pause-reset');
            const deathOverlay = document.getElementById('you-died-overlay');
            resetButton.disabled = true;
            resetButton.textContent = '復帰中...';
            playerHP = 0;
            updatePlayerHealthUI();
            clearInputState();
            // 状態も解除してからポーズ画面を閉じ、YOU DIEDを表示
            setPaused(false);
            pauseOverlay.style.display = 'none';
            deathOverlay.style.display = 'flex';
            if (document.pointerLockElement && document.exitPointerLock) document.exitPointerLock();
            setTimeout(() => {
                respawnPlayer(true);
                deathOverlay.style.display = 'none';
                resetButton.disabled = false;
                resetButton.textContent = 'リセット（死亡して復帰）';
            }, 1400);
        });

        const spawnOptionButtons = [...document.querySelectorAll('.spawn-option')];
        const spawnStatus = document.getElementById('spawn-status');
        spawnOptionButtons.forEach(button => {
            button.addEventListener('click', () => {
                if (gameStarted) return;
                selectedSpawnArea = button.dataset.area;
                spawnOptionButtons.forEach(option => {
                    const isSelected = option === button;
                    option.classList.toggle('selected', isSelected);
                    option.setAttribute('aria-pressed', String(isSelected));
                });
                spawnStatus.textContent = selectedSpawnArea === 'random'
                    ? '選択中：ランダム（復帰ごとにエリアも抽選）'
                    : '選択中：' + SPAWN_AREA_NAMES[selectedSpawnArea] + '（エリア内でランダムに出現）';
            });
        });
        document.getElementById('start-button').addEventListener('click', () => {
            if (gameStarted) return;
            respawnPlayer(true);
            gameStarted = true;
            pauseOpenButton.style.display = 'block';
            document.getElementById('start-screen').style.display = 'none';
            if (!isMobile && document.body.requestPointerLock) {
                renderer.domElement.focus?.();
                document.body.requestPointerLock();
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            if (!gameStarted || isPaused) {
                camera.position.copy(playerPos);
                camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
                renderer.render(scene, camera);
                return;
            }
            // タブ復帰時の巨大なdeltaで移動や物理が暴れないよう、フレーム時間を制限
            const delta = Math.min(clock.getDelta(), 0.05);
            const frameScale = delta * 60;
            updateAutoAim(delta);
            camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));

            if (!isMobile) {
                moveF = 0;
                moveR = 0;
                if (keys['w']) moveF += 1;
                if (keys['s']) moveF -= 1;
                if (keys['a']) moveR -= 1;
                if (keys['d']) moveR += 1;
            }

            const fw = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            fw.y = 0;
            fw.normalize();
            const rt = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), fw).negate();

            const moveVec = new THREE.Vector3(
                fw.x * moveF + rt.x * moveR,
                0,
                fw.z * moveF + rt.z * moveR
            );
            // 斜め移動でも前後左右と同じ速度にする
            if (moveVec.lengthSq() > 1) moveVec.normalize();
            moveVec.multiplyScalar(MOVE_SPEED * frameScale);

            const nX = Math.max(WORLD_BOUNDS.minX + PLAYER_RADIUS, Math.min(playerPos.x + moveVec.x, WORLD_BOUNDS.maxX - PLAYER_RADIUS));
            const nZ = Math.max(WORLD_BOUNDS.minZ + PLAYER_RADIUS, Math.min(playerPos.z + moveVec.z, WORLD_BOUNDS.maxZ - PLAYER_RADIUS));

            if (!checkCollision(nX, playerPos.z, PLAYER_RADIUS)) {
                playerPos.x = nX;
            }
            if (!checkCollision(playerPos.x, nZ, PLAYER_RADIUS)) {
                playerPos.z = nZ;
            }

            velocityY -= 0.019 * frameScale;
            playerPos.y += velocityY * frameScale;
            if (playerPos.y <= 1.6) {
                playerPos.y = 1.6;
                velocityY = 0;
                isGrounded = true;
            }

            if (isFiring && !isReloading) {
                shoot();
            }

            const weapon = weapons[currentWeapon];
            if (isReloading) {
                reloadTimer += delta;
                const p = Math.min(reloadTimer / weapon.reloadTime, 1);
                reloadBar.style.width = (p * 100) + '%';
                gunGroup.position.y = Math.sin(p * Math.PI) * -0.65;
                if (reloadTimer >= weapon.reloadTime) {
                    isReloading = false;
                    ammo = weapon.maxAmmo;
                    document.getElementById('ammo-display').innerText = `${ammo} / ${weapon.maxAmmo}`;
                    reloadUI.style.display = 'none';
                    gunGroup.position.y = 0;
                }
            } else {
                gunGroup.position.y = Math.sin(Date.now() * 0.0025) * 0.015;
                gunGroup.position.z += (0 - gunGroup.position.z) * Math.min(1, 0.18 * frameScale);
            }

            // 覗き込み時は武器を中央へ寄せ、武器ごとにズーム量を変える
            const aimFov = { pistol: 58, rifle: 46, sniper: 20, shotgun: 58 }[currentWeapon];
            const desiredFov = isAiming ? aimFov : 75;
            camera.fov += (desiredFov - camera.fov) * Math.min(1, delta * 10);
            camera.updateProjectionMatrix();
            if (currentGunModel) {
                const targetX = isAiming ? (currentWeapon === 'sniper' ? -0.02 : 0.02) : 0.32;
                const targetY = isAiming ? -0.22 : -0.28;
                const targetZ = isAiming ? -0.42 : -0.50;
                currentGunModel.position.x += (targetX - currentGunModel.position.x) * Math.min(1, delta * 12);
                currentGunModel.position.y += (targetY - currentGunModel.position.y) * Math.min(1, delta * 12);
                currentGunModel.position.z += (targetZ - currentGunModel.position.z) * Math.min(1, delta * 12);
            }

            updateDummies(delta);
            updateMinimap();
            camera.position.copy(playerPos);
            renderer.render(scene, camera);
        }
        animate();

        function resizeGame() {
            const size = getViewportSize();
            camera.aspect = size.width / size.height;
            camera.updateProjectionMatrix();
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            renderer.setSize(size.width, size.height, false);
        }

        window.addEventListener('resize', resizeGame);
        window.addEventListener('orientationchange', () => requestAnimationFrame(resizeGame));
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', resizeGame);
        }
        resizeGame();
    </script>
</body>
</html>
